name: Fire4Nix WPE runtime recursive ELF closure audit
on:
  push:
    branches: ['test/r36h-real-elf-closure-stage-only-block-20261022']
    paths:
      - 'scripts/audit-wpe-runtime-closure.py'
      - 'scripts/build-wpe2541-subprocesses-rocknix.sh'
      - 'native/tests/test_wpe_runtime_elf_closure.py'
      - 'native/tests/test_wpe_closure_real_aarch64.sh'
      - '.github/workflows/r36h-wpe-runtime-closure-tests.yml'
  pull_request:
    paths:
      - 'scripts/audit-wpe-runtime-closure.py'
      - 'scripts/build-wpe2541-subprocesses-rocknix.sh'
      - 'native/tests/test_wpe_runtime_elf_closure.py'
      - 'native/tests/test_wpe_closure_real_aarch64.sh'
      - '.github/workflows/r36h-wpe-runtime-closure-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-static-closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and exercise read-only ELF dependency checker
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-wpe2541-subprocesses-rocknix.sh
          bash native/tests/test_wpe_subprocess_target_guard.sh
          grep -Fq 'WPE_PRIVATE_RUNTIME_CLOSURE=PASS_SDK_STATIC_SONAMES_NOT_DEVICE_ABI' scripts/build-wpe2541-subprocesses-rocknix.sh
          python3 -m py_compile scripts/audit-wpe-runtime-closure.py
          python3 -m py_compile native/tests/test_wpe_runtime_elf_closure.py
          python3 native/tests/test_wpe_runtime_elf_closure.py
          python3 scripts/audit-wpe-runtime-closure.py --help > /dev/null
          echo 'WPE_STATIC_CLOSURE_UNIT_TESTS=PASS_HOST_FIXTURES_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'WPE_AARCH64_RUNTIME_BUILT_OR_EXECUTED=no' >> "$GITHUB_STEP_SUMMARY"
          echo 'R36H_INSTALLABLE=no' >> "$GITHUB_STEP_SUMMARY"

  test-real-aarch64-fixtures:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile genuine ARM64 ELF shared libs and guard transitive SONAMEs
        shell: bash
        run: |
          set -euo pipefail
          bash -n native/tests/test_wpe_closure_real_aarch64.sh
          bash native/tests/test_wpe_closure_real_aarch64.sh
          echo 'AARCH64_ELF_TEST=PASS_REAL_ARM64_ELFS_NO_TARGET_EXECUTION' >> "$GITHUB_STEP_SUMMARY"
          echo 'WPE_WEBKIT_ENGINE_COMPILED=no' >> "$GITHUB_STEP_SUMMARY"
          echo 'R36H_INSTALLABLE=no' >> "$GITHUB_STEP_SUMMARY"
