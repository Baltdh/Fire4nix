name: Fire4Nix assemble first experimental offline R36H Ports candidate

on:
  push:
    branches: ['build/r36h-first-offline-ports-candidate-20261022', 'fix/r36h-first-test-accept-gcc15-build-20261023', 'audit/r36h-wpe-gcc15-atomic-elf-gates-current-main-20261023']
    paths:
      - 'scripts/package-first-r36h-ports-candidate.py'
      - 'native/tests/test_ports_wpe_gcc15_atomic_gate.py'
      - 'native/tests/test_ports_wpe_firsttest_assembly.sh'
      - 'installer/www/primeiro-teste.html'
      - 'installer/www/inicio.html'
      - 'installer/Fire4Nix-Teste.sh'
      - 'native/tests/test_first_r36h_offline_visual.py'
      - 'native/tests/test_first_r36h_offline_js.cjs'
      - 'scripts/resolve-wpe-runtime-download.py'
      - 'native/tests/test_wpe_runtime_download_resolver.py'
      - '.github/workflows/r36h-first-offline-ports-candidate.yml'
  pull_request:
    paths:
      - 'scripts/package-first-r36h-ports-candidate.py'
      - 'native/tests/test_ports_wpe_gcc15_atomic_gate.py'
      - 'native/tests/test_ports_wpe_firsttest_assembly.sh'
      - 'installer/www/primeiro-teste.html'
      - 'installer/www/inicio.html'
      - 'installer/Fire4Nix-Teste.sh'
      - 'native/tests/test_first_r36h_offline_visual.py'
      - 'native/tests/test_first_r36h_offline_js.cjs'
      - 'scripts/resolve-wpe-runtime-download.py'
      - 'native/tests/test_wpe_runtime_download_resolver.py'
      - '.github/workflows/r36h-first-offline-ports-candidate.yml'
  workflow_dispatch:
    inputs:
      wpe_run_id:
        description: 'Run ID of successful genuine ROCKNIX WPE 2.54.1 build with SDK-closed private runtime'
        required: true
        type: string
  workflow_run:
    workflows:
      - 'Fire4Nix GCC15 no-outline WPE 2.54 real ROCKNIX ARM64 link'
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  packager-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download proven native ARM64 launcher only (not a WebKit motor)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39880058319
          github-token: ${{ github.token }}
          name: Fire4Nix-0.86-R36H-ARM64-Native-Test
          path: ${{ runner.temp }}/native-download
      - name: Extract and pin native ARM64 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-086"
          unzip -q "$RUNNER_TEMP/native-download/Fire4Nix-0.86-R36H-ARM64-Native-Test.zip" -d "$RUNNER_TEMP/native-086"
          export FIRE4NIX_NATIVE_086_ELF="$RUNNER_TEMP/native-086/fire4nix-native-086-aarch64"
          echo "FIRE4NIX_NATIVE_086_ELF=$FIRE4NIX_NATIVE_086_ELF" >> "$GITHUB_ENV"
          test "$(sha256sum "$FIRE4NIX_NATIVE_086_ELF" | cut -d' ' -f1)" = 4295f354873519802fc5817a1ee6d194489d1cc824fcd8e2cb65569d0fa0f1f4
          readelf -h "$FIRE4NIX_NATIVE_086_ELF" | grep -Eq 'Machine:.*AArch64'
      - name: Test ZIP candidate structure with real native ARM64 ELF and synthetic WebKit fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/package-first-r36h-ports-candidate.py
          python3 native/tests/test_ports_wpe_gcc15_atomic_gate.py
          python3 -m py_compile scripts/resolve-wpe-runtime-download.py
          python3 native/tests/test_wpe_runtime_download_resolver.py
          bash -n native/tests/test_ports_wpe_firsttest_assembly.sh
          bash native/tests/test_ports_wpe_firsttest_assembly.sh
          python3 native/tests/test_first_r36h_offline_visual.py
          node --check native/tests/test_first_r36h_offline_js.cjs
          node native/tests/test_first_r36h_offline_js.cjs
          sh -n installer/Fire4Nix-Teste.sh
          echo 'FIRST_TEST_PORTS_PACKAGING_TEST=PASS_FIXTURES_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'WPE_WEBKIT_ENGINE_BUILT_IN_THIS_JOB=no' >> "$GITHUB_STEP_SUMMARY"
          echo 'R36H_FIRST_FRAME_VERIFIED=no' >> "$GITHUB_STEP_SUMMARY"

  assemble-real-test-candidate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'fix/r36h-wpe-gcc15-atomics-link-20261023')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate exact successful genuine WPE source build
        id: authenticate-wpe
        uses: actions/github-script@v7
        with:
          script: |
            const id = Number('${{ github.event.workflow_run.id || inputs.wpe_run_id }}')
            if (!Number.isSafeInteger(id) || id < 1) throw new Error('Invalid WPE build run ID')
            const { data } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: id
            })
            const oldAuthorized =
              data.name === 'Fire4Nix WPE WebProcess and NetworkProcess ROCKNIX real ARM64' &&
              data.event === 'workflow_dispatch' && data.head_branch === 'main'
            const gcc15Authorized =
              data.name === 'Fire4Nix GCC15 no-outline WPE 2.54 real ROCKNIX ARM64 link' &&
              data.event === 'push' &&
              data.head_branch === 'fix/r36h-wpe-gcc15-atomics-link-20261023'
            if (data.conclusion !== 'success' ||
                data.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo ||
                !(oldAuthorized || gcc15Authorized)) {
              throw new Error('WPE source must be a successful allowlisted genuine ROCKNIX build, not an arbitrary Actions run')
            }
            core.setOutput('wpe_artifact_name',
              gcc15Authorized
              ? 'Fire4Nix-ROCKNIX-WPE2541-GCC15-NO-OUTLINE-NOT-INSTALLABLE'
              : 'Fire4Nix-ROCKNIX-WPE2541-TWO-PROCESSES-STATIC-STAGE-NOT-INSTALLABLE')
      - name: Download exact successful ROCKNIX WPE runtime candidate
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.wpe_run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.authenticate-wpe.outputs.wpe_artifact_name }}
          path: ${{ runner.temp }}/wpe-download
      - name: Download exact tested native ARM64 launcher
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39880058319
          github-token: ${{ github.token }}
          name: Fire4Nix-0.86-R36H-ARM64-Native-Test
          path: ${{ runner.temp }}/native-download
      - name: Assemble ZIP only if full real runtime and SHA256 evidence pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-086" delivery
          unzip -q "$RUNNER_TEMP/native-download/Fire4Nix-0.86-R36H-ARM64-Native-Test.zip" -d "$RUNNER_TEMP/native-086"
          native="$RUNNER_TEMP/native-086/fire4nix-native-086-aarch64"
          test "$(sha256sum "$native" | cut -d' ' -f1)" = 4295f354873519802fc5817a1ee6d194489d1cc824fcd8e2cb65569d0fa0f1f4
          runtime=$(python3 scripts/resolve-wpe-runtime-download.py \
            --download-root "$RUNNER_TEMP/wpe-download") || {
              echo 'ERROR: no single full SDK-closed WPE runtime inside the verified build artifact' >&2
              exit 6
            }
          python3 scripts/package-first-r36h-ports-candidate.py \
            --runtime "$runtime" --native "$native" --installer installer \
            --output delivery/Fire4Nix-R36H-PRIMEIRO-TESTE-EXPERIMENTAL.zip
          sha256sum delivery/*.zip > delivery/SHA256SUMS.txt
          cat > delivery/STATUS.txt <<EOF
          FIRE4NIX_TEST_CANDIDATE=STATIC_ARM64_CHECKS_ONLY
          WPE_SOURCE_RUN_ID=${{ github.event.workflow_run.id || inputs.wpe_run_id }}
          NATIVE_SOURCE_RUN_ID=39880058319
          R36H_HARDWARE_TESTED=no
          R36H_INSTALLABLE_VERIFIED=no
          EOF
          cat delivery/STATUS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish first experimental Ports candidate only after complete static gate
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-R36H-EXPERIMENTAL-OFFLINE-TEST-CANDIDATE
          path: delivery/
          if-no-files-found: error
          retention-days: 14
