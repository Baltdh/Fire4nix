name: Fire4Nix genuine ROCKNIX AArch64 Pixman 0.46.2 for Cairo

on:
  push:
    branches: ['feat/r36h-rocknix-pixman-cairo-prerequisite-20261021']
    paths:
      - '.github/workflows/r36h-rocknix-pixman-cairo-prereq.yml'
      - 'scripts/build-rocknix-pixman-cairo-prereq.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pixman-cross-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install host-only build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ pkg-config ninja-build python3 python3-pip python3-setuptools \
            python3-packaging python3-pyelftools
          python3 -m pip install --user 'meson==1.8.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -n fire4nix/scripts/build-rocknix-pixman-cairo-prereq.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39682062894
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-SEVEN-REAL-DEPS-PRIVATE-STAGE
          path: seven-artifact
      - name: Restore toolchain to its original ROCKNIX build path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar -tJf "$archive" > "$RUNNER_TEMP/sdk-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/sdk-members.txt"; then
            echo 'ERROR: SDK checkpoint unsafe path' >&2; exit 4
          fi
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          test -s "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6"
          echo 'PINNED_ROCKNIX_SDK=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Build Pixman using ROCKNIX AArch64 Meson settings and link target consumer
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-pixman-cairo-prereq.sh 2>&1 | tee pixman-console.txt
          grep -Fxq 'PIXMAN_TARGET_BUILD=PASS_REAL_ROCKNIX_AARCH64' pixman-work/reports/acceptance.txt
          grep -Fxq 'PIXMAN_GLIB_PNG_ZLIB_CONSUMER=PASS_AARCH64_REAL_SONAMES' pixman-work/reports/acceptance.txt
      - name: Preserve genuine AArch64 target stage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-Pixman-0.46.2-CAIRO-PREREQ-TARGET-TEST-ONLY
          path: |
            pixman-work/reports/
            pixman-work/stage/usr/lib/
            pixman-work/stage/usr/include/
            pixman-console.txt
          retention-days: 14
          if-no-files-found: warn
