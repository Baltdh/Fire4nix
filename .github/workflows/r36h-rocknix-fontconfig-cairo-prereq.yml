name: Fire4Nix genuine ROCKNIX AArch64 Fontconfig 2.17.1 for Cairo

on:
  push:
    branches: ['feat/r36h-fontconfig-2171-rocknix-cairo-20261021']
    paths:
      - '.github/workflows/r36h-rocknix-fontconfig-cairo-prereq.yml'
      - 'scripts/build-rocknix-fontconfig-cairo-prereq.sh'
      - 'scripts/assemble-rocknix-fontconfig-stages.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fontconfig-cross-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Host-only build tools (never target libraries)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make autoconf automake libtool libtool-bin pkg-config \
            gettext gperf ninja-build cmake python3 python3-packaging \
            libglib2.0-dev
          bash -n fire4nix/scripts/build-rocknix-fontconfig-cairo-prereq.sh
          python3 -m py_compile fire4nix/scripts/assemble-rocknix-fontconfig-stages.py
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39686365026
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Pixman-0.46.2-CAIRO-PREREQ-TARGET-TEST-ONLY
          path: pixman-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39685435460
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-FREETYPE-2.13.3-AARCH64-STAGE-ONLY
          path: freetype-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39683023507
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libxml2-2.14.4-TARGET-STAGE
          path: xml-artifact
      - name: Restore genuine ROCKNIX AArch64 SDK at original isolated path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar -tJf "$archive" > "$RUNNER_TEMP/sdk-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/sdk-members.txt"; then
            echo 'ERROR: unsafe toolchain archive member' >&2; exit 4
          fi
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          echo 'GENUINE_ROCKNIX_SDK=PASS_AARCH64_GLIBC_2_41' >> "$GITHUB_STEP_SUMMARY"
      - name: Merge target stages and cross-build Expat plus Fontconfig
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-fontconfig-cairo-prereq.sh 2>&1 | tee fontconfig-console.txt
          grep -Fxq 'FONTCONFIG_BUILD=PASS_REAL_ROCKNIX_AARCH64' fontconfig-target/reports/acceptance.txt
          grep -Fxq 'FONTCONFIG_FREETYPE_EXPAT_XML_PIXMAN_CONSUMER=PASS_REAL_AARCH64' fontconfig-target/reports/acceptance.txt
      - name: Preserve AArch64 library closure, source provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-Fontconfig-2.17.1-CAIRO-PREREQ-TEST-ONLY
          path: |
            fontconfig-target/reports/
            fontconfig-target/stage/usr/lib/
            fontconfig-target/stage/usr/include/
            fontconfig-console.txt
          retention-days: 14
          if-no-files-found: warn
