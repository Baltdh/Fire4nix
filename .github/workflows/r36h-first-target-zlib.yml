name: Fire4Nix first real ROCKNIX AArch64 zlib target library
on:
  push:
    branches: ['feat/r36h-first-rocknix-zlib-target-20261021']
    paths:
      - '.github/workflows/r36h-first-target-zlib.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  zlib-real-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore compiler at its original build-root path and verify ABI
        shell: bash
        env:
          SNAPSHOT: ${{ runner.temp }}/sdk-download/rocknix-toolchain-host-only.tar.xz
        run: |
          set -euo pipefail
          mkdir -p zlib-reports "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64"
          test -s "$SNAPSHOT"
          tar --no-same-owner --no-same-permissions -xJf "$SNAPSHOT" -C "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64"
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          sysroot="$sdk/aarch64-rocknix-linux-gnu/sysroot"
          cc="$sdk/bin/aarch64-rocknix-linux-gnu-gcc"
          test -x "$cc"
          test -f "$sdk/fire4nix-toolchain.cmake"
          test -s "$sysroot/usr/lib/libc.so.6"
          "$cc" -dumpmachine | tee zlib-reports/compiler-target.txt
          test "$("$cc" -dumpmachine)" = 'aarch64-rocknix-linux-gnu'
          readelf -h "$sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          grep -Fq "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64" "$sdk/fire4nix-toolchain.cmake"
          echo 'COMPILER_RESTORED_AT_ORIGINAL_PATH=PASS' | tee zlib-reports/restore-report.txt
      - name: Build zlib 1.3.1 with ROCKNIX compiler into private target DESTDIR
        shell: bash
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          archive="$RUNNER_TEMP/zlib-1.3.1.tar.gz"
          curl -fLsS --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 90 \
            'https://zlib.net/fossils/zlib-1.3.1.tar.gz' -o "$archive"
          echo '9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  '"$archive" | sha256sum -c -
          test "$(git -C rocknix-source rev-parse HEAD)" = '3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb'
          grep -Fxq 'PKG_VERSION="1.3.1"' rocknix-source/packages/compress/zlib/package.mk
          grep -Fxq 'PKG_SHA256="9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"' rocknix-source/packages/compress/zlib/package.mk
          mkdir -p "$RUNNER_TEMP/zlib-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zlib-source"
          cmake -S "$RUNNER_TEMP/zlib-source/zlib-1.3.1" -B "$RUNNER_TEMP/zlib-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$sdk/fire4nix-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DINSTALL_PKGCONFIG_DIR=/usr/lib/pkgconfig \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/zlib-build" --parallel 2
          export DESTDIR="$GITHUB_WORKSPACE/zlib-rocknix-target-only"
          cmake --install "$RUNNER_TEMP/zlib-build" | tee zlib-reports/cmake-install.txt
          so=$(find "$DESTDIR/usr/lib" -maxdepth 1 -type f -name 'libz.so*' -print -quit)
          test -n "$so"
          readelf -h "$so" | grep -Eq 'Class:.*ELF64'
          readelf -h "$so" | grep -Eq 'Machine:.*AArch64'
          test -f "$DESTDIR/usr/lib/pkgconfig/zlib.pc"
          PKG_CONFIG_LIBDIR="$DESTDIR/usr/lib/pkgconfig" PKG_CONFIG_PATH='' PKG_CONFIG_SYSROOT_DIR="$DESTDIR" \
            pkg-config --exists 'zlib >= 1.3.1'
          req=$(readelf --version-info "$so" | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -Vu | tail -n 1 || true)
          if [ -n "$req" ]; then
            awk -v req="$req" 'BEGIN {
              split(req,v,"."); exit !(v[1]<2 || (v[1]==2 && v[2]<=41))
            }'
          fi
          {
            echo 'ZLIB_TARGET_BUILD=PASS_REAL_ROCKNIX_AARCH64'
            echo 'ZLIB_VERSION=1.3.1'
            echo 'TARGET_GLIBC_MAX=2.41'
            echo "ELF_MACHINE=AArch64"
            echo "GLIBC_REQUIRED=${req:-none}"
            echo "DESTDIR=private_not_device"
            echo 'R36H_INSTALLABLE=no'
            echo 'WPE_BROWSER_BUILT=no'
          } | tee zlib-reports/target-zlib-report.txt
          {
            echo '## First real WPE prerequisite built with ROCKNIX toolchain'
            cat zlib-reports/target-zlib-report.txt
            echo 'This is one target library, not a complete browser or validated relocatable SDK.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve first ROCKNIX target-library report and staged .so/.pc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-RK3326-Zlib-REAL-TARGET-TEST-ONLY
          path: |
            zlib-reports/
            zlib-rocknix-target-only/usr/lib/
            zlib-rocknix-target-only/usr/include/
          retention-days: 7
          if-no-files-found: warn
