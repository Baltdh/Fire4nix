name: Fire4Nix genuine ROCKNIX RK3326 libxslt 1.1.43
on:
  push:
    branches: ['feat/r36h-rocknix-libxslt-target-20261021']
    paths:
      - 'scripts/build-rocknix-libxslt-target.sh'
      - '.github/workflows/r36h-rocknix-libxslt-target.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  libxslt-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39683023507
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libxml2-2.14.4-TARGET-STAGE
          path: xml-artifact
      - name: Restore ROCKNIX toolchain and assert real libxml2 ELF from artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz" -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          test -s xml-artifact/libxml2-target/stage/usr/lib/libxml2.so.16
          test -s xml-artifact/libxml2-target/stage/usr/include/libxml2/libxml/parser.h
      - name: Cross-compile libxslt and test target ARM64 linkage
        shell: bash
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/build-rocknix-libxslt-target.sh
          bash fire4nix/scripts/build-rocknix-libxslt-target.sh | tee libxslt-console.txt
          grep -Fxq 'LIBXSLT_BUILD=PASS_REAL_ROCKNIX_AARCH64' libxslt-target/reports/result.txt
      - name: Save libxslt target stage and diagnostic logs on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-libxslt-1.1.43-TARGET-STAGE
          path: |
            libxslt-target/stage/
            libxslt-target/reports/
            libxslt-console.txt
          retention-days: 14
          if-no-files-found: warn
