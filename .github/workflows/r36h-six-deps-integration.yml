name: Fire4Nix combine SIX genuine ROCKNIX AArch64 dependencies
on:
  push:
    branches: ['feat/r36h-six-deps-pcre2-integration-20261021']
    paths:
      - 'scripts/verify-six-rocknix-deps.sh'
      - '.github/workflows/r36h-six-deps-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  combined-target-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39677982091
          github-token: ${{ github.token }}
          name: Fire4Nix-RK3326-LibPNG-1.6.40-EFFECTIVE-ROCKNIX-TARGET
          path: png-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39539424500
          github-token: ${{ github.token }}
          name: Fire4Nix-RK3326-SQLite-REAL-TARGET-TEST-ONLY
          path: sqlite-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39538774186
          github-token: ${{ github.token }}
          name: Fire4Nix-libtasn1-4.21.0-ROCKNIX-RK3326-STAGE-ONLY
          path: libtasn1-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39678224570
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libffi-3.5.1-STATIC-PIC-STAGE
          path: libffi-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39679260246
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-pcre2-10.45-STATIC-PIC-STAGE
          path: pcre2-artifact
      - name: Restore genuine ROCKNIX compiler at its original host location
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test -x "$sdk/bin/aarch64-rocknix-linux-gnu-gcc"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
      - name: Assemble six libraries in private target stage and cross-link
        shell: bash
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/verify-six-rocknix-deps.sh
          bash fire4nix/scripts/verify-six-rocknix-deps.sh
          grep -Fxq 'SIX_DEPENDENCY_STAGE=PASS_REAL_ROCKNIX_AARCH64' four-rocknix/report/six-acceptance.txt
          grep -Fxq 'SIX_CONSUMER_LINK=PASS_FOUR_SHARED_PLUS_THREE_STATIC_ARCHIVES' four-rocknix/report/six-acceptance.txt
          cat four-rocknix/report/six-acceptance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve stage and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-SIX-REAL-DEPS-PRIVATE-STAGE
          path: |
            four-rocknix/report/
            four-rocknix/stage/
            four-rocknix/build/
          retention-days: 14
          if-no-files-found: warn
