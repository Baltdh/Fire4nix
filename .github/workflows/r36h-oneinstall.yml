name: Fire4Nix 1.09 R36H ELF, GLIBC and GStreamer ABI guards
on:
  push:
    paths:
      - 'installer/**'
      - 'native/fire4nix_wpeplatform.cpp'
      - 'native/tests/mock_wpewebkit.cpp'
      - 'native/tests/test_launch_gamepad.sh'
      - 'native/tests/test_runtime_diagnostic.sh'
      - 'native/tests/test_runtime_selection.sh'
      - 'native/tests/test_runtime_staging.sh'
      - 'native/tests/test_ondevice_testkit.sh'
      - 'native/tests/test_segv_stage_diagnostic.sh'
      - 'native/tests/test_ports_direct.sh'
      - 'native/tests/test_runtime_prereqs.sh'
      - 'native/tests/test_isolated_loader.sh'
      - 'native/tests/test_elf_guard.sh'
      - 'native/tests/test_wpe_gstreamer_guard.sh'
      - 'source_r36h/Fire4Nix/scripts/run_browser.sh'
      - 'source_r36h/Fire4Nix/scripts/wpe_platform_launch.sh'
      - 'rocknix-integration/**'
      - 'scripts/Install-Fire4Nix-Once.sh'
      - '.github/workflows/r36h-oneinstall.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build real ARM64 executable
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ pkg-config libglib2.0-dev
          mkdir -p out/Fire4Nix/bin out/Fire4Nix/www out/Fire4Nix/config
          g++ -std=c++17 -Os -flto -mtune=cortex-a35 -ffunction-sections -fdata-sections -Wall -Wextra -Werror native/fire4nix_wpeplatform.cpp \
            $(pkg-config --cflags --libs glib-2.0 gobject-2.0) -ldl -Wl,--gc-sections,-z,relro,-z,now \
            -o out/Fire4Nix/bin/fire4nix-native-aarch64
          strip --strip-unneeded out/Fire4Nix/bin/fire4nix-native-aarch64
          readelf -h out/Fire4Nix/bin/fire4nix-native-aarch64 | grep -q AArch64
          out/Fire4Nix/bin/fire4nix-native-aarch64 --selftest | grep AArch64
          cp installer/Fire4Nix-Iniciar.sh out/Fire4Nix/Fire4Nix-Iniciar.sh
          cp installer/Diagnosticar-Fire4Nix.sh out/Diagnosticar-Fire4Nix.sh
          cp installer/Fire4Nix-Teste.sh out/Fire4Nix-Teste.sh
          cp installer/Fire4Nix-Investigar-139.sh out/Fire4Nix-Investigar-139.sh
          cp installer/Fire4Nix-Tracar-139.sh out/Fire4Nix-Tracar-139.sh
          cp installer/Fire4Nix-Inspecionar-ELF.sh out/Fire4Nix-Inspecionar-ELF.sh
          cp installer/Fire4Nix-Inspecionar-ELF.sh out/Fire4Nix/Fire4Nix-Inspecionar-ELF.sh
          cp installer/Fire4Nix-Investigar-139.sh out/Fire4Nix/Fire4Nix-Investigar-139.sh
          cp installer/Fire4Nix-Direto.sh out/Fire4Nix-Direto.sh
          cp installer/Fire4Nix-Teste.sh out/Fire4Nix/Fire4Nix-Teste.sh
          cp installer/Habilitar-Teste-Ports.sh out/Habilitar-Teste-Ports.sh
          cp rocknix-integration/build-wpe-2.54.1.sh out/Preparar-WPE-ROCKNIX-2.54.1.sh
          cp rocknix-integration/stage-wpe-runtime.sh out/Empacotar-WPE-ROCKNIX.sh
          cp rocknix-integration/audit-wpe-gstreamer.sh out/audit-wpe-gstreamer.sh
          cp rocknix-integration/audit-wpe-gstreamer.sh out/Fire4Nix-Auditar-GStreamer.sh
          cp installer/Diagnosticar-Fire4Nix.sh out/Fire4Nix/Diagnosticar-Fire4Nix.sh
          cp scripts/Install-Fire4Nix-Once.sh out/Instalar-Fire4Nix-Uma-Vez.sh
          printf '#!/bin/sh\nD=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P) || exit 2\nexec sh "$D/Fire4Nix-Iniciar.sh" --open "$@"\n' > out/Fire4Nix/Fire4Nix.sh
          cp installer/www/inicio.html out/Fire4Nix/www/inicio.html
          # PR #148: ship the actual offline 640x480 HTML/CSS/JS
          # first-frame test; otherwise the on-device visual kit refuses.
          cp installer/www/primeiro-teste.html out/Fire4Nix/www/primeiro-teste.html
          test -s out/Fire4Nix/www/primeiro-teste.html
          cp installer/config/fire4nix.gptk out/Fire4Nix/config/fire4nix.gptk
          cat > out/LEIA-ME.txt <<'README'
          Fire4Nix 1.07 R36H - localiza ELF e WebKit em cartoes/pastas diferentes.
          Nunca execute o binario x86_64 dos backups antigos no R36H ARM64.
          O pacote CONTEM o executavel ARM64, homepage, scripts e instalador.
          Copie Fire4Nix-Direto.sh para roms/ports/ para iniciar a partir do menu Ports.
          Ports exige WPEWebProcess e WPENetworkProcess; so omite WPEGPUProcess com BUILD-REPORT.txt verificado.
          O diagnostico --safe registra Fontconfig, MIME, bwrap, colisao de libs e GLIBC.
          Fire4Nix-Investigar-139.sh --safe NAO executa WebKit.
          Fire4Nix-Investigar-139.sh --trace roda somente preflight ABI com LD_DEBUG.
          Cole os 2 scripts na pasta roms/ports/: Fire4Nix-Investigar-139.sh e Fire4Nix-Tracar-139.sh.
          Selecione Fire4Nix-Investigar-139 no Ports para diagnostico seguro; Fire4Nix-Tracar-139 para captura ELF 139.
          O segundo script nao depende do inicializador antigo de WebKit no SD.
          Relatorio: /storage/Fire4Nix-Investigacao-139/Fire4Nix-139-ultimo.txt.
          Por padrao o launcher ignora LD_LIBRARY_PATH herdado de outros ports.
          FIRE4NIX_INHERIT_LIBRARY_PATH=1 restabelece temporariamente o modo antigo.
          Isso nao comprova a causa do segfault 139, e nao substitui o motor WebKit.
          O atalho encontra instalacoes em SD interno/externo sem precisar mover o navegador.
          O arquivo manager pode mostrar View em vez de executar: use a entrada Ports.
          Falha 139 continua sendo erro nativo WPE; veja /storage/Fire4Nix-PORTS-ultimo.txt.
          NAO contem a biblioteca WebKit ~174 MB nem seus WPEWebProcess/WPENetworkProcess/WPEGPUProcess.
          O instalador copia os arquivos WPE JA INSTALADOS no R36H para uma nova pasta unica.
          Se faltarem os arquivos, CANCELA e nao modifica o sistema.
          Extraia e execute: sh Instalar-Fire4Nix-Uma-Vez.sh
          Depois procure Fire4Nix em Ports. O resultado grafico no hardware nao esta comprovado.
          Preflight --check-platform recusa a biblioteca WebKit legada sem WPEPlatform.
          O instalador verifica tambem a homepage e diagnosticos, e evita regravar
          o WPE quando hardlinks sao suportados (fallback copia para FAT/exFAT).
          Confirme em Diagnosticar-Fire4Nix.sh e Fire4Nix-ultimo-resultado.txt.
          WPEPlatform aplica ajustes de memoria na criacao do WebView, registra
          desconexao do display Wayland (codigo 71) e solicita fullscreen no Sway.
          Teclado virtual opcional usa setas e Enter sem hardware adicional.
          Diagnosticar-Fire4Nix.sh identifica WebKit de outro SD, dependencias
          e codigos da API; --screen exibe resumo curto que pode ser fotografado.
          Exemplo: sh Diagnosticar-Fire4Nix.sh --screen
          Agora identifica versao real do WPE, separa APIs antigas e observa
          que WPE 2.54.1+ corrige compatibilidade de build com Wayland 1.25+.
          Preparar-WPE-ROCKNIX-2.54.1.sh compila no SDK ROCKNIX; --stage
          instala em DESTDIR privado e usa Empacotar-WPE-ROCKNIX.sh para
          auditar ELF ARM64, WPEPlatform, subprocessos e checksums.
          Instalador prefere WPE com ABI compativel, sem copiar candidatos ruins;
          motor completo WebKit NAO esta incluido nem testado na Mali fisica.
          PRIMEIRO TESTE NO R36H: sh Diagnosticar-Fire4Nix.sh --safe
          --safe verifica ELF/simbolos sem carregar a biblioteca que falhou (139).
          SEGUNDO TESTE, so depois: sh Diagnosticar-Fire4Nix.sh --screen
          O diagnostico registra a ultima etapa executada pelo WPE em SIGSEGV.
          Teste geral: sh Fire4Nix-Teste.sh --safe ou --screen
          Se houver 139, fotografe WPEPlatform_fault_stage no relatorio.
          TESTE GRAFICO: sh Fire4Nix-Teste.sh --visual (somente se ja instalado)
          Para instalar atalhos independentes no menu Ports:
          sh Habilitar-Teste-Ports.sh
          Registra /storage/Fire4Nix-Teste/Fire4Nix-Ultimo-Teste.txt,
          /storage/Fire4Nix-Teste/Fire4Nix-Diagnostico-101.txt e resumo.
          Os atalhos de teste NAO substituem o navegador existente e NAO
          copiam os 174 MB do WebKit.
          Atalhos: Ctrl+H inicio offline, Ctrl+R recarregar, Alt+Esquerda voltar,
          Alt+Direita avancar,
          F11 tela cheia/janela, Ctrl+Q sair. Dependem de entrada teclado no Sway.
          Controle via gptokeyb disponivel se ROCKNIX tiver o binario e
          conseguir criar teclado/mouse virtual. Nao instala drivers.
          Seletor + A inicio, Seletor + B fechar, Seletor + X recarregar.
          FIRE4NIX_GAMEPAD=0 desliga; falha imediata do auxiliar e registrada.
          mktemp cria logs independentes, e a instalacao evita uma copia grande
          de WebKit se hardlinks falharem e o espaco nao for suficiente.
          A controladora fisica e o Wayland no console ainda exigem validacao.
          Nao desativa sandbox nem modifica /usr ou drivers Mali.
          ATENCAO v1.09: auditoria de GStreamer identifica GST_CAT_DEFAULT
          indefinido em seis .so recuperadas. Execute pelo terminal:
          sh Fire4Nix-Auditar-GStreamer.sh --audit
          Relatorio: /storage/Fire4Nix-GStreamer-Auditoria.txt
          A auditoria NAO resolve a ABI, NAO executa WebKit e nao modifica /usr.
          Runtime WPE real NAO esta incluido no pequeno pacote deste workflow.
          README
          chmod +x out/Fire4Nix-Investigar-139.sh out/Fire4Nix/Fire4Nix-Investigar-139.sh out/Fire4Nix-Tracar-139.sh
          sh -n out/Fire4Nix-Tracar-139.sh
          sh -n out/Fire4Nix-Investigar-139.sh
          sh -n out/Fire4Nix/Fire4Nix-Investigar-139.sh
          chmod +x out/Fire4Nix-Direto.sh
          sh -n out/Fire4Nix-Direto.sh
          sh native/tests/test_ports_direct.sh
          sh native/tests/test_runtime_prereqs.sh
          sh native/tests/test_isolated_loader.sh
          sh native/tests/test_elf_guard.sh
          sh native/tests/test_wpe_gstreamer_guard.sh
          sh -n out/Fire4Nix-Auditar-GStreamer.sh
          sh -n out/Fire4Nix-Inspecionar-ELF.sh
          chmod +x out/Instalar-Fire4Nix-Uma-Vez.sh out/Diagnosticar-Fire4Nix.sh out/Fire4Nix-Teste.sh out/Habilitar-Teste-Ports.sh out/Fire4Nix/*.sh out/Fire4Nix/bin/*
          sh -n out/Instalar-Fire4Nix-Uma-Vez.sh
          sh -n out/Fire4Nix-Teste.sh
          sh -n out/Fire4Nix/Fire4Nix-Teste.sh
          sh -n out/Habilitar-Teste-Ports.sh
          sh -n out/Preparar-WPE-ROCKNIX-2.54.1.sh
          sh -n out/Empacotar-WPE-ROCKNIX.sh
          sh -n out/audit-wpe-gstreamer.sh
          sh out/Empacotar-WPE-ROCKNIX.sh --help | grep -q 'isolated ROCKNIX AArch64 DESTDIR'
          sh out/Preparar-WPE-ROCKNIX-2.54.1.sh --plan | grep -q 'target=ROCKNIX-20260801-aarch64-cortex-a35'
          set +e
          sh out/Preparar-WPE-ROCKNIX-2.54.1.sh --configure >/tmp/fire4nix-no-sdk.log 2>&1
          no_sdk_status=$?
          set -e
          test "$no_sdk_status" -eq 4
          grep -q 'cross-toolchain CMake file required' /tmp/fire4nix-no-sdk.log
          sh -n out/Fire4Nix/Fire4Nix-Iniciar.sh
          grep -q '^a_hk = add_ctrl' out/Fire4Nix/config/fire4nix.gptk
          grep -q '^up = repeat' out/Fire4Nix/config/fire4nix.gptk
          sh native/tests/test_launch_gamepad.sh
          sh native/tests/test_runtime_diagnostic.sh
          FIRE4NIX_TEST_PKG=out sh native/tests/test_runtime_selection.sh
          FIRE4NIX_TEST_PKG=out sh -x native/tests/test_ondevice_testkit.sh
          sh native/tests/test_segv_stage_diagnostic.sh
          sh -n out/Diagnosticar-Fire4Nix.sh
          sh -n out/Fire4Nix/Diagnosticar-Fire4Nix.sh
          grep -Fq 'JS OK' out/Fire4Nix/www/primeiro-teste.html
          grep -Fq 'PENDENTE' out/Fire4Nix/www/primeiro-teste.html
          grep -Fq '3 cores' out/Fire4Nix/www/primeiro-teste.html
          grep -q 'ArrowDown' out/Fire4Nix/www/inicio.html
          grep -q 'keyboardToggle' out/Fire4Nix/www/inicio.html
          grep -q 'Espaço' out/Fire4Nix/www/inicio.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('out/Fire4Nix/www/inicio.html').read_text()
          js=re.search(r'<script>(.*?)</script>',source,re.S)
          assert js, 'Inline JS missing'
          Path('/tmp/fire4nix-home.js').write_text(js.group(1))
          PY
          node --check /tmp/fire4nix-home.js
          grep -q 'DuckDuckGo' out/Fire4Nix/www/inicio.html
          out/Fire4Nix/bin/fire4nix-native-aarch64 --help | grep -q check-platform
          (cd out && sha256sum Fire4Nix/bin/fire4nix-native-aarch64 > SHA256SUMS.txt)
      - name: Test refused install and safe mock migration
        shell: bash
        run: |
          set -euo pipefail
          t=$(mktemp -d)
          mkdir -p "$t/roms/tools" "$t/pkg"
          cp -a out/. "$t/pkg/"
          set +e
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh" > "$t/failure" 2>&1
          result=$?
          set -e
          test "$result" -eq 3
          test ! -e "$t/roms/ports/Fire4Nix.sh"
          # Missing-library diagnostics must be captured even before startup.
          set +e
          FIRE4NIX_LOG_DIR="$t/logs" sh "$t/pkg/Fire4Nix/Fire4Nix-Iniciar.sh" --check-platform > "$t/no-webkit.txt" 2>&1
          missing_status=$?
          set -e
          test "$missing_status" -eq 127
          grep -q 'Missing local WPE WebKit runtime' "$t/logs/Fire4Nix-"*-log-*
          grep -q 'fire4nix_exit_code=127' "$t/logs/Fire4Nix-"*-log-*
          FIRE4NIX_DIAGNOSTIC_OUT="$t/diagnostic.txt" sh "$t/pkg/Diagnosticar-Fire4Nix.sh"
          grep -q 'WPE_library=missing' "$t/diagnostic.txt"
          grep -q 'WPEPlatform_preflight_exit=127' "$t/diagnostic.txt"
          mkdir -p "$t/roms/tools/Fire4Nix/runtime/lib" "$t/roms/tools/Fire4Nix/runtime/libexec/wpe-webkit-2.0"
          printf 'dummy-webkit-library' > "$t/roms/tools/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1"
          for bin in WPEWebProcess WPENetworkProcess WPEGPUProcess; do
            printf 'dummy' > "$t/roms/tools/Fire4Nix/runtime/libexec/wpe-webkit-2.0/$bin"
          done
          # Mock only in test stage: production artifact retains the real ARM64 ELF.
          printf '#!/bin/sh\nif [ "$1" = --check-platform ]; then exit 0; fi\nexit 127\n' > "$t/pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          chmod +x "$t/pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          test -f "$t/roms/ports/Fire4Nix.sh"
          cmp "$t/roms/tools/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1" "$t/roms/ports/fire4nix-completo/runtime/lib/libWPEWebKit-2.0.so.1"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh" | grep 'already installed'
          test "$(find "$t/roms/ports" -maxdepth 1 -name '.fire4nix-staging-*' | wc -l)" -eq 0
          # Homepage-only changes MUST trigger an actual update without changing native binary.
          printf '<!-- homepage-only-update -->\n' >> "$t/pkg/Fire4Nix/www/inicio.html"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -q 'homepage-only-update' "$t/roms/ports/fire4nix-completo/www/inicio.html"
          # A change exclusively to the first-frame page must also upgrade
          # the installed copy; matching homepage/native/runtime is not enough.
          printf '<!-- offline-firstframe-page-update -->\n' >> "$t/pkg/Fire4Nix/www/primeiro-teste.html"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -Fq 'offline-firstframe-page-update' "$t/roms/ports/fire4nix-completo/www/primeiro-teste.html"

          # Controller profile-only upgrades must not be silently skipped.
          printf '# controller-profile-update\n' >> "$t/pkg/Fire4Nix/config/fire4nix.gptk"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -q 'controller-profile-update' "$t/roms/ports/fire4nix-completo/config/fire4nix.gptk"
          # Source WebKit and installed WebKit can share an inode on link-capable filesystems.
          test "$t/roms/tools/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1" -ef "$t/roms/ports/fire4nix-completo/runtime/lib/libWPEWebKit-2.0.so.1"
          test -n "$(find "$t/roms/ports" -maxdepth 1 -name 'fire4nix-completo.backup-*' -print -quit)"
          # Disable hardlinks to emulate FAT/exFAT or a different SD card.
          mkdir -p "$t/nolink"
          printf '#!/bin/sh\nexit 1\n' > "$t/nolink/ln"
          chmod +x "$t/nolink/ln"
          printf '<!-- fat-fallback-update -->\n' >> "$t/pkg/Fire4Nix/www/inicio.html"
          PATH="$t/nolink:$PATH" FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -q 'fat-fallback-update' "$t/roms/ports/fire4nix-completo/www/inicio.html"
          # Unlike ext4 hardlinks, the fallback must yield an independent file.
          test ! "$t/roms/tools/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1" -ef "$t/roms/ports/fire4nix-completo/runtime/lib/libWPEWebKit-2.0.so.1"
          # Probe succeeds, but a later hardlink copy can fail (permissions,
          # filesystem restrictions or unsupported files); copy independently.
          mkdir -p "$t/partialcp"
          cat > "$t/partialcp/cp" <<'FAIL_LINK_COPY'
          #!/bin/sh
          if [ "$1" = "-al" ]; then exit 18; fi
          exec /usr/bin/cp "$@"
          FAIL_LINK_COPY
          chmod +x "$t/partialcp/cp"
          printf '<!-- fallback-after-probe -->\n' >> "$t/pkg/Fire4Nix/www/inicio.html"
          PATH="$t/partialcp:$PATH" FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -q 'fallback-after-probe' "$t/roms/ports/fire4nix-completo/www/inicio.html"
          test ! "$t/roms/tools/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1" -ef "$t/roms/ports/fire4nix-completo/runtime/lib/libWPEWebKit-2.0.so.1"

          # A failed hardlink copy must not silently start a full copy when
          # available capacity fits only the link-only path.
          mkdir -p "$t/limitedspace"
          cp "$t/partialcp/cp" "$t/limitedspace/cp"
          cat > "$t/limitedspace/df" <<'LOWSPACE'
          #!/bin/sh
          printf 'Filesystem 1024-blocks Used Available Capacity Mounted on\n'
          printf 'mock 50000 17231 32769 34%% /mock\n'
          LOWSPACE
          chmod +x "$t/limitedspace/df"
          printf '<!-- blocked-lowspace-update -->\n' >> "$t/pkg/Fire4Nix/www/inicio.html"
          set +e
          PATH="$t/limitedspace:$PATH" FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh" > "$t/lowspace.log" 2>&1
          limited_status=$?
          set -e
          test "$limited_status" -eq 6
          grep -q 'Insufficient space for fallback copy' "$t/lowspace.log"
          grep -q 'fallback-after-probe' "$t/roms/ports/fire4nix-completo/www/inicio.html"
          if grep -q 'blocked-lowspace-update' "$t/roms/ports/fire4nix-completo/www/inicio.html"; then
            echo 'FAIL: disk-space refusal replaced working homepage' >&2
            exit 1
          fi
          test -z "$(find "$t/roms/ports" -maxdepth 1 -name '.fire4nix-staging-*' -print -quit)"
          test -z "$(find "$t/roms/ports" -maxdepth 1 -name '.fire4nix-linkprobe-*' -print -quit)"
          # A new binary must trigger an upgrade, not be silently skipped.
          printf '\n# v090 update\n' >> "$t/pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh"
          grep -q '# v090 update' "$t/roms/ports/fire4nix-completo/bin/fire4nix-native-aarch64"
          test -n "$(find "$t/roms/ports" -maxdepth 1 -name 'fire4nix-completo.backup-*' -print -quit)"
          # Simulate filesystem failure precisely after moving the old installation.
          printf '\n# simulated failure\n' >> "$t/pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          mkdir -p "$t/failbin"
          cat > "$t/failbin/mv" <<'FAILMV'
          #!/bin/sh
          case "$1" in
            */.fire4nix-staging-*) exit 63 ;;
          esac
          exec /usr/bin/mv "$@"
          FAILMV
          chmod +x "$t/failbin/mv"
          set +e
          PATH="$t/failbin:$PATH" FIRE4NIX_ROMS="$t/roms" sh "$t/pkg/Instalar-Fire4Nix-Uma-Vez.sh" > "$t/rollback.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 7
          test -f "$t/roms/ports/Fire4Nix.sh"
          grep -q '# v090 update' "$t/roms/ports/fire4nix-completo/bin/fire4nix-native-aarch64"
          if grep -q '# simulated failure' "$t/roms/ports/fire4nix-completo/bin/fire4nix-native-aarch64"; then
            echo 'FAIL: failed update replaced working binary'
            exit 1
          fi
          test -z "$(find "$t/roms/ports" -maxdepth 1 -name '.fire4nix-staging-*' -print -quit)"
          FIRE4NIX_DIAGNOSTIC_OUT="$t/installed-report.txt" sh "$t/roms/ports/fire4nix-completo/Diagnosticar-Fire4Nix.sh"
          grep -q 'WPEPlatform_preflight_exit=0' "$t/installed-report.txt"
          echo 'PASS: safe migration, homepage-only update, ext4 hardlinks, FAT/exFAT fallback, rollback, early logs and diagnostics'
      - name: Validate WebKit WPEPlatform API vs legacy-only WPE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/modern-wpe /tmp/old-wpe
          g++ -std=c++17 -Os -fPIC -shared -Wall -Wextra -Werror native/tests/mock_wpewebkit.cpp $(pkg-config --cflags --libs glib-2.0 gobject-2.0) -o /tmp/modern-wpe/libWPEWebKit-2.0.so.1
          g++ -std=c++17 -Os -fPIC -shared -Wall -Wextra -Werror -DMOCK_NO_PLATFORM native/tests/mock_wpewebkit.cpp $(pkg-config --cflags --libs glib-2.0 gobject-2.0) -o /tmp/old-wpe/libWPEWebKit-2.0.so.1
          LD_LIBRARY_PATH=/tmp/modern-wpe out/Fire4Nix/bin/fire4nix-native-aarch64 --check-platform > /tmp/fire4nix-api-probe.log 2>&1
          grep -q 'wpe_version=2.54.1' /tmp/fire4nix-api-probe.log
          FIRE4NIX_MOCK_WPE_VERSION=2.54.0 LD_LIBRARY_PATH=/tmp/modern-wpe out/Fire4Nix/bin/fire4nix-native-aarch64 --check-platform > /tmp/fire4nix-wpe-2540.log 2>&1
          grep -q 'wpe_version=2.54.0' /tmp/fire4nix-wpe-2540.log
          grep -q 'prefer WPE 2.54.1+' /tmp/fire4nix-wpe-2540.log
          FIRE4NIX_MOCK_WPE_VERSION=2.50.0 LD_LIBRARY_PATH=/tmp/modern-wpe out/Fire4Nix/bin/fire4nix-native-aarch64 --check-platform > /tmp/fire4nix-wpe-2500.log 2>&1
          grep -q 'older than 2.54' /tmp/fire4nix-wpe-2500.log
          grep -q 'webkit_library=' /tmp/fire4nix-api-probe.log
          grep -q 'wpe_event_get_event_type=present' /tmp/fire4nix-api-probe.log
          grep -q 'wpe_toplevel_fullscreen=present' /tmp/fire4nix-api-probe.log
          grep -q 'wpe_view_get_display=present' /tmp/fire4nix-api-probe.log
          grep -q 'NOT a GPU/Wayland rendering test' /tmp/fire4nix-api-probe.log
          FIRE4NIX_HOME_URL=file:///tmp/fire4nix-home.html LD_LIBRARY_PATH=/tmp/modern-wpe out/Fire4Nix/bin/fire4nix-native-aarch64 --smoke about:blank > /tmp/fire4nix-v090-smoke.log 2>&1
          grep -q 'fullscreen requested' /tmp/fire4nix-v090-smoke.log
          grep -q 'load-event=3' /tmp/fire4nix-v090-smoke.log
          grep -q 'settings supplied during webview creation' /tmp/fire4nix-v090-smoke.log
          grep -q 'shortcut Ctrl+H: home' /tmp/fire4nix-v090-smoke.log
          grep -q 'load_uri request=file:///tmp/fire4nix-home.html' /tmp/fire4nix-v090-smoke.log
          grep -q 'shortcut Ctrl+R: reload' /tmp/fire4nix-v090-smoke.log
          grep -q '\[MOCK-WPE\] reload performed' /tmp/fire4nix-v090-smoke.log
          grep -q 'shortcut Alt+Left: back' /tmp/fire4nix-v090-smoke.log
          grep -q '\[MOCK-WPE\] back performed' /tmp/fire4nix-v090-smoke.log
          grep -q 'shortcut Alt+Right: forward' /tmp/fire4nix-v090-smoke.log
          grep -q '\[MOCK-WPE\] forward performed' /tmp/fire4nix-v090-smoke.log
          grep -q 'shortcut F11: window mode' /tmp/fire4nix-v090-smoke.log
          grep -q '\[MOCK-WPE\] window mode requested' /tmp/fire4nix-v090-smoke.log
          set +e
          LD_LIBRARY_PATH=/tmp/old-wpe out/Fire4Nix/bin/fire4nix-native-aarch64 --check-platform
          old_status=$?
          set -e
          test "$old_status" -eq 78
          FIRE4NIX_MOCK_QUIT=1 LD_LIBRARY_PATH=/tmp/modern-wpe timeout 4s out/Fire4Nix/bin/fire4nix-native-aarch64 about:blank > /tmp/fire4nix-v091-quit.log 2>&1
          grep -q 'shortcut Ctrl+Q: close browser' /tmp/fire4nix-v091-quit.log
          set +e
          FIRE4NIX_MOCK_TERMINATE=1 LD_LIBRARY_PATH=/tmp/modern-wpe             out/Fire4Nix/bin/fire4nix-native-aarch64 --smoke about:blank > /tmp/fire4nix-v092-crash.log 2>&1
          crash_status=$?
          set -e
          test "$crash_status" -eq 70
          grep -q 'web-process-terminated' /tmp/fire4nix-v092-crash.log
          # A Wayland/WPE display disconnect must not leave an invisible browser.
          set +e
          FIRE4NIX_MOCK_DISPLAY_DISCONNECT=1 LD_LIBRARY_PATH=/tmp/modern-wpe             out/Fire4Nix/bin/fire4nix-native-aarch64 --smoke about:blank > /tmp/fire4nix-display-loss.log 2>&1
          display_status=$?
          set -e
          test "$display_status" -eq 71
          grep -q 'WPEPlatform display disconnect monitoring active' /tmp/fire4nix-display-loss.log
          grep -q 'WPE display disconnected' /tmp/fire4nix-display-loss.log
          grep -q 'load-event=3' /tmp/fire4nix-v092-crash.log
          echo 'PASS: navigation, quit, crash status preserved and legacy WPE rejected'
      - name: Verify WPE runtime staging from isolated ROCKNIX DESTDIR (mock only)
        shell: bash
        run: |
          set -euo pipefail
          sh native/tests/test_runtime_staging.sh
          # Never add the fake CI WPE runtime to the release archive.
          test ! -d out/Fire4Nix/runtime
      - name: Build download artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd out && zip -q -r ../Fire4Nix-R36H-1.09-GStreamer-Diagnostico.zip .)
          unzip -t Fire4Nix-R36H-1.09-GStreamer-Diagnostico.zip | tail -1
          # 170 MiB ZIP ceiling agreed with user. This package does NOT bundle WPE.
          bytes=$(stat -c %s Fire4Nix-R36H-1.09-GStreamer-Diagnostico.zip)
          test "$bytes" -le $((170 * 1024 * 1024))
          sha256sum Fire4Nix-R36H-1.09-GStreamer-Diagnostico.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-R36H-1.09-GStreamer-Diagnostico
          path: Fire4Nix-R36H-1.09-GStreamer-Diagnostico.zip
          if-no-files-found: error
          retention-days: 30
