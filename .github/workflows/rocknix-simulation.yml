name: ROCKNIX environment simulation
on:
  push:
    branches: [feature/extracted-source-audit]
  workflow_dispatch:
jobs:
  filesystem-simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable startup, Wayland environment and recovery
        run: |
          bash -n deploy/Fire4Nix-ROCKNIX.sh deploy/test_portable_launcher.sh deploy/test_rocknix_simulation.sh deploy/test_rocknix_failure_modes.sh
          sh -n deploy/Fire4Nix-WPE-Diagnostico.sh
          echo '=== test: test_portable_launcher.sh ==='
          bash deploy/test_portable_launcher.sh
          echo '=== test: test_rocknix_simulation.sh ==='
          bash deploy/test_rocknix_simulation.sh
          echo '=== test: test_rocknix_failure_modes.sh ==='
          bash deploy/test_rocknix_failure_modes.sh
          echo '=== test: test_engine_entrypoints.sh ==='
          bash deploy/test_engine_entrypoints.sh
          echo '=== test: test_wpe_bundle_activation.sh ==='
          bash deploy/test_wpe_bundle_activation.sh
          echo '=== test: test_r36h_prepare_runtime.sh ==='
          bash deploy/test_r36h_prepare_runtime.sh
          echo '=== test: test_wpe_environment_isolation.sh ==='
          bash deploy/test_wpe_environment_isolation.sh
      - name: Publish standalone Tools diagnostic
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-Tools-Diagnostico
          path: deploy/Fire4Nix-WPE-Diagnostico.sh
          if-no-files-found: error
      - name: Publish offline WPE hardware smoke test for Tools
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-Tools-Teste-WPE-Real
          path: deploy/Fire4Nix-WPE-Teste-Real.sh
          if-no-files-found: error
      - name: Inspect official ROCKNIX build sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch next https://github.com/ROCKNIX/distribution.git /tmp/rocknix
          git -C /tmp/rocknix sparse-checkout set --no-cone Dockerfile Makefile
          test -f /tmp/rocknix/Dockerfile
          test -f /tmp/rocknix/Makefile
          git -C /tmp/rocknix rev-parse HEAD > rocknix-upstream-commit.txt
          printf 'Host architecture: %s\n' "$(uname -m)" >> rocknix-upstream-commit.txt
          cat rocknix-upstream-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rocknix-source-reference-${{ matrix.os }}
          path: rocknix-upstream-commit.txt
          if-no-files-found: error
