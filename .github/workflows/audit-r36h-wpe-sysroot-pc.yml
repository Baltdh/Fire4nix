name: Fire4Nix WPE 2.54.1 target sysroot dependency audit

on:
  push:
    paths:
      - 'rocknix-integration/audit-wpe-sysroot-pkgconfig.sh'
      - 'native/tests/test_wpe_sysroot_pkgconfig_audit.sh'
      - '.github/workflows/audit-r36h-wpe-sysroot-pc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpe-sysroot-readiness-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pkg-config target-only paths and minimum versions
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config
          sh -n rocknix-integration/audit-wpe-sysroot-pkgconfig.sh
          sh -n native/tests/test_wpe_sysroot_pkgconfig_audit.sh
          sh native/tests/test_wpe_sysroot_pkgconfig_audit.sh
          {
            echo '## WPE 2.54.1 target-only pkg-config audit'
            echo 'Validated 22 package metadata gates and rejection of host .pc contamination.'
            echo '**CI uses fake .pc metadata, not a real SDK, WPE runtime or console test.**'
          } >> "$GITHUB_STEP_SUMMARY"
