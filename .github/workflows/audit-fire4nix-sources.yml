name: Audit current Fire4Nix sources
on:
  push:
    paths:
      - 'source_r36h/**'
      - 'scripts/**'
      - 'installer/**'
      - 'native/**'
      - 'rocknix-integration/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '*.zip'
  pull_request:
    paths:
      - 'source_r36h/**'
      - 'scripts/**'
      - 'installer/**'
      - 'native/**'
      - 'rocknix-integration/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install host test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ make binutils ninja-build
      - name: Check current source syntax and historical archive integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess
          import zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          counts = {'files': len(files), 'shell': 0, 'python': 0, 'json': 0, 'zip': 0}
          for name in files:
              path = Path(name)
              if path.suffix == '.sh':
                  shell = 'bash' if 'bash' in path.read_text().splitlines()[0] else 'sh'
                  subprocess.run([shell, '-n', name], check=True)
                  counts['shell'] += 1
              elif path.suffix == '.py':
                  ast.parse(path.read_text(), filename=name)
                  counts['python'] += 1
              elif path.suffix == '.json':
                  json.loads(path.read_text())
                  counts['json'] += 1
              elif path.suffix == '.zip':
                  with zipfile.ZipFile(path) as archive:
                      bad = archive.testzip()
                      if bad:
                          raise RuntimeError(f'{name}: corrupt entry {bad}')
                  counts['zip'] += 1
          print(json.dumps(counts, indent=2))
          PY
      - name: Run all host Python and compiled tab/build regressions
        run: python3 -m unittest discover -s native/tests -p 'test_*.py' -v
      - name: Test offline JavaScript without claiming a hardware frame
        run: node native/tests/test_first_r36h_offline_js.cjs
      - name: Test launcher and diagnostic behavior with host fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in first_test_graphics_probe isolated_loader launch_gamepad launcher_verified_gpu_profile \
            launcher_wpe_assets_paths ports_installer_gpu_profile runtime_diagnostic \
            runtime_prereqs segv_stage_diagnostic elf_guard wpe_gstreamer_guard \
            wpe_subprocess_target_guard; do
            bash "native/tests/test_${name}.sh"
          done
