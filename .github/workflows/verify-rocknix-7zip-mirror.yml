name: Fire4Nix verify ROCKNIX 7-Zip 25.00 source mirror (no build)

on:
  push:
    paths:
      - 'scripts/verify-rocknix-7zip-mirror.sh'
      - 'rocknix-integration/stage-7zip-source-mirror.sh'
      - '.github/workflows/verify-rocknix-7zip-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout ROCKNIX pinned tag in disposable source tree
        uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Strict source mirror and archive integrity preflight
        shell: bash
        env:
          FIRE4NIX_7ZIP_REPORT: /tmp/fire4nix-7zip-report/rocknix-7zip-source.txt
        run: |
          set -euo pipefail
          bash -n scripts/verify-rocknix-7zip-mirror.sh
          bash scripts/verify-rocknix-7zip-mirror.sh --check
          grep -Fxq 'SOURCE_MIRROR_STATUS=PASS' "$FIRE4NIX_7ZIP_REPORT"
          echo '7-Zip 25.00 SourceForge mirror: SHA-256 verified against the ROCKNIX 20260801 source recipe.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is **source-only verification**, not compiler, sysroot or WebKit build.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check and stage verified SourceForge URL without changing version or SHA256
        shell: bash
        env:
          FIRE4NIX_ROCKNIX_SOURCE: ${{ github.workspace }}/rocknix-source
          FIRE4NIX_7ZIP_REPORT: /tmp/fire4nix-7zip-report/rocknix-7zip-source.txt
        run: |
          set -euo pipefail
          bash -n rocknix-integration/stage-7zip-source-mirror.sh
          bash rocknix-integration/stage-7zip-source-mirror.sh --check
          bash rocknix-integration/stage-7zip-source-mirror.sh --apply
          git -C "$FIRE4NIX_ROCKNIX_SOURCE" diff --check
          test "$(git -C "$FIRE4NIX_ROCKNIX_SOURCE" diff --name-only)" = 'packages/compress/7-zip/package.mk'
          grep -Fxq 'PKG_SHA256="bff9e69b6ca73a5b8715d7623870a39dc90ad6ce1f4d1070685843987af1af9b"' "$FIRE4NIX_ROCKNIX_SOURCE/packages/compress/7-zip/package.mk"
          echo 'Only 7-Zip source URL changed in disposable ROCKNIX tree; version and SHA256 preserved.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve mirror verification report, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-7zip-2500-mirror-sha256-report
          path: /tmp/fire4nix-7zip-report/
          retention-days: 7
          if-no-files-found: warn
