name: Fire4Nix R36H first physical test package

on:
  push:
    branches:
      - codex/r36h-first-physical-test-20261030
      - codex/r36h-file-html-mime-fix-20261031
      - codex/r36h-runtime-loader-provenance-20261031
    paths:
      - 'installer/Fire4Nix-Iniciar.sh'
      - 'native/**'
      - '.github/workflows/fire4nix-native-086.yml'
      - 'native/tests/test_local_html_mime_fallback.sh'
      - 'installer/Fire4Nix-Primeiro-Teste-R36.sh'
      - 'installer/Fire4Nix-EGL-R36H.py'
      - 'installer/LEIA-ME-PRIMEIRO-TESTE-R36H.txt'
      - 'native/tests/test_first_test_graphics_probe.sh'
      - 'installer/Fire4Nix-Teste.sh'
      - 'installer/Fire4Nix-Direto.sh'
      - 'installer/config/fire4nix.gptk'
      - 'installer/www/inicio.html'
      - 'installer/www/primeiro-teste.html'
      - 'scripts/package-first-r36h-ports-candidate.py'
      - 'installer/Diagnosticar-Fire4Nix.sh'
      - 'installer/Fire4Nix-Inspecionar-ELF.sh'
      - '.github/workflows/r36h-first-physical-test-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble-r36h-first-test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve matching ARM64 native launcher artifact
        id: native-run
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '')
            const changedPaths = commit => [
              ...(commit?.added || []),
              ...(commit?.modified || []),
              ...(commit?.removed || [])
            ]
            const changed = [
              ...(context.payload.commits || []).flatMap(changedPaths),
              ...changedPaths(context.payload.head_commit || {})
            ]
            const nativeChanged = changed.some(file =>
              file.startsWith('native/') || file === '.github/workflows/fire4nix-native-086.yml'
            )
            const listRuns = async () => {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'fire4nix-native-086.yml',
                branch,
                per_page: 30
              })
              return response.data.workflow_runs.filter(item =>
                item.head_repository?.full_name === context.repo.owner + '/' + context.repo.repo
              )
            }
            let run = null
            if (nativeChanged) {
              // The native and package workflows start from the same push.
              // Wait for the exact SHA to avoid packaging a stale launcher.
              for (let attempt = 0; attempt < 60; attempt++) {
                const runs = await listRuns()
                run = runs.find(item => item.head_sha === context.sha)
                if (run && run.status === 'completed') break
                await new Promise(resolve => setTimeout(resolve, 10000))
              }
              if (!run || run.conclusion !== 'success') {
                throw new Error('Matching ARM64 native build did not complete successfully for ' + context.sha)
              }
            } else {
              // Installer/UI-only changes may reuse the latest native build,
              // but never fall back to an older success if the newest build
              // failed. That would silently package stale native code.
              await new Promise(resolve => setTimeout(resolve, 15000))
              let newest = null
              for (let attempt = 0; attempt < 18; attempt++) {
                const runs = await listRuns()
                newest = [...runs].sort((a, b) =>
                  Date.parse(b.created_at) - Date.parse(a.created_at)
                )[0] || null
                if (newest && newest.status === 'completed') break
                await new Promise(resolve => setTimeout(resolve, 10000))
              }
              if (!newest || newest.status !== 'completed' || newest.conclusion !== 'success') {
                throw new Error('Latest ARM64 native launcher build is missing or unsuccessful; refusing stale artifact fallback')
              }
              run = newest
            }
            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            })
            const nativeArtifact = artifactsResponse.data.artifacts.find(item =>
              item.name === 'Fire4Nix-0.86-R36H-ARM64-Native-Test' && !item.expired
            )
            if (!nativeArtifact) {
              throw new Error('Native launcher artifact missing or expired for workflow run ' + run.id)
            }
            core.setOutput('run_id', String(run.id))
            core.setOutput('artifact_id', String(nativeArtifact.id))
            core.setOutput('source_sha', run.head_sha)
            core.setOutput('artifact_digest', nativeArtifact.digest || 'unavailable')

      - name: Download pinned ROCKNIX WPE 2.54.1 runtime artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 40033262653
          github-token: ${{ github.token }}
          name: Fire4Nix-R36H-Mali-EGL-Experimental
          path: ${{ runner.temp }}/wpe-artifact

      - name: Download matching Fire4Nix ARM64 launcher
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.native-run.outputs.run_id }}
          github-token: ${{ github.token }}
          name: Fire4Nix-0.86-R36H-ARM64-Native-Test
          path: ${{ runner.temp }}/native-artifact

      - name: Verify and extract source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-package" "$RUNNER_TEMP/package"
          echo 'ARTIFACT_STAGE=START'
          find "$RUNNER_TEMP/wpe-artifact" -maxdepth 3 -type f -printf 'WPE_ARTIFACT_FILE=%p size=%s bytes\n'
          find "$RUNNER_TEMP/native-artifact" -maxdepth 3 -type f -printf 'NATIVE_ARTIFACT_FILE=%p size=%s bytes\n'

          # download-artifact already expands the Actions transport archive.
          # The remaining .zip in each directory is the actual package payload:
          # one unzip per payload, not a second nested unzip.
          echo 'CHECK=WPE_OUTER_SHA256_BEGIN'
          (cd "$RUNNER_TEMP/wpe-artifact" && sha256sum -c SHA256SUMS.txt)
          echo 'CHECK=WPE_OUTER_SHA256_PASS'

          wpe_package_zip="$(find "$RUNNER_TEMP/wpe-artifact" -type f -name 'Fire4Nix-R36H-Mali-EGL-Experimental.zip' -print -quit)"
          test -n "$wpe_package_zip"
          echo "WPE_PACKAGE_ZIP=$wpe_package_zip"
          unzip -q "$wpe_package_zip" -d "$RUNNER_TEMP/package"
          echo 'CHECK=WPE_RUNTIME_EXTRACT_PASS'
          test -s "$RUNNER_TEMP/wpe-artifact/PROVENANCE.txt"
          cp "$RUNNER_TEMP/wpe-artifact/PROVENANCE.txt" "$RUNNER_TEMP/package/PROVENANCE-WPE-RUNTIME.txt"

          # This pinned WPE run used the source revision below. Its successful
          # configure step passed -DENABLE_BUBBLEWRAP_SANDBOX=OFF. Record this
          # security-relevant build fact in the runtime report, rather than
          # incorrectly treating missing bwrap as an unverified runtime.
          wpe_source_sha=5623e79c8705e7b10882cccf280fb2cfdbedc1b7
          git fetch --no-tags --depth=1 origin "$wpe_source_sha"
          git show "$wpe_source_sha:scripts/prepare-unified-rocknix-wpe2541.sh" > "$RUNNER_TEMP/wpe-configure-source.sh"
          grep -Fq -- '-DENABLE_BUBBLEWRAP_SANDBOX=OFF' "$RUNNER_TEMP/wpe-configure-source.sh"
          runtime="$RUNNER_TEMP/package/Fire4Nix/runtime"
          test -s "$runtime/BUILD-REPORT.txt"
          if grep -q '^ENABLE_BUBBLEWRAP_SANDBOX=' "$runtime/BUILD-REPORT.txt"; then
            grep -Fxq 'ENABLE_BUBBLEWRAP_SANDBOX=OFF' "$runtime/BUILD-REPORT.txt"
          else
            printf 'ENABLE_BUBBLEWRAP_SANDBOX=OFF\n' >> "$runtime/BUILD-REPORT.txt"
          fi
          cat > "$RUNNER_TEMP/package/PROVENANCE-WPE-SANDBOX.txt" <<EOF
          WPE_RUNTIME_ARTIFACT_RUN=40033262653
          WPE_RUNTIME_SOURCE_COMMIT=$wpe_source_sha
          WPE_BUILD_WORKFLOW_RUN_STATUS=success
          WPE_CONFIGURE_SOURCE=scripts/prepare-unified-rocknix-wpe2541.sh
          WPE_CMAKE_OPTION=-DENABLE_BUBBLEWRAP_SANDBOX=OFF
          WPE_BUILD_EVIDENCE_ARTIFACT_ID=12540919010
          WPE_BUILD_EVIDENCE_ARTIFACT_DIGEST=sha256:c1ba19f95c9d1dd88cdac173734e0d9591c1671773b1a84643579599f960fda9
          WPE_SANDBOX_STATUS=DISABLED_AT_BUILD_SECURITY_REDUCED
          EOF
          (cd "$runtime" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$runtime" && sha256sum -c SHA256SUMS.txt)
          echo 'CHECK=WPE_SANDBOX_BUILD_PROVENANCE_PASS'


          native_package_zip="$(find "$RUNNER_TEMP/native-artifact" -type f -name 'Fire4Nix-0.86-R36H-ARM64-Native-Test.zip' -print -quit)"
          test -n "$native_package_zip"
          echo "NATIVE_PACKAGE_ZIP=$native_package_zip"
          unzip -q "$native_package_zip" -d "$RUNNER_TEMP/native-package"
          echo 'CHECK=NATIVE_PACKAGE_EXTRACT_PASS'
          (cd "$RUNNER_TEMP/native-package" && sha256sum -c SHA256SUMS.txt)
          echo 'CHECK=NATIVE_PACKAGE_SHA256_PASS'

          require_file() {
            local file="$1"
            if [ ! -s "$file" ]; then
              echo "MISSING_OR_EMPTY_FILE=$file" >&2
              find "$RUNNER_TEMP/package/Fire4Nix/runtime" -maxdepth 5 -type f -printf 'RUNTIME_FILE=%p size=%s bytes\n' | head -200 || true
              exit 22
            fi
            echo "CHECK=FILE_PRESENT:$file"
          }
          require_file "$RUNNER_TEMP/package/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1"
          require_file "$RUNNER_TEMP/package/Fire4Nix/runtime/libexec/wpe-webkit-2.0/WPEWebProcess"
          require_file "$RUNNER_TEMP/package/Fire4Nix/runtime/libexec/wpe-webkit-2.0/WPENetworkProcess"
          require_file "$RUNNER_TEMP/package/Fire4Nix/runtime/lib/wpe-webkit-2.0/injected-bundle/libWPEInjectedBundle.so"
          require_file "$RUNNER_TEMP/package/Fire4Nix/runtime/share/wpe-webkit-2.0/inspector.gresource"
          require_file "$RUNNER_TEMP/native-package/fire4nix-native-086-aarch64"

          echo 'CHECK=WPE_RUNTIME_SHA256_BEGIN'
          (cd "$RUNNER_TEMP/package/Fire4Nix/runtime" && sha256sum -c SHA256SUMS.txt)
          echo 'CHECK=WPE_RUNTIME_SHA256_PASS'
          echo 'ARTIFACT_STAGE=PASS'
      - name: Integrate newest launcher and first-test scripts
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/package"
          cp "$RUNNER_TEMP/native-package/fire4nix-native-086-aarch64" \
            "$pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          cp installer/Fire4Nix-Iniciar.sh "$pkg/Fire4Nix/Fire4Nix-Iniciar.sh"
          cp installer/Fire4Nix-Primeiro-Teste-R36.sh "$pkg/Fire4Nix-Primeiro-Teste-R36.sh"
          cp installer/Fire4Nix-EGL-R36H.py "$pkg/Fire4Nix-EGL-R36H.py"
          cp installer/LEIA-ME-PRIMEIRO-TESTE-R36H.txt "$pkg/LEIA-ME-PRIMEIRO-TESTE-R36H.txt"
          cp installer/Fire4Nix-Teste.sh "$pkg/Fire4Nix-Teste.sh"
          cp installer/Fire4Nix-Teste.sh "$pkg/Fire4Nix/Fire4Nix-Teste.sh"
          cp installer/Diagnosticar-Fire4Nix.sh "$pkg/Diagnosticar-Fire4Nix.sh"
          cp installer/Diagnosticar-Fire4Nix.sh "$pkg/Fire4Nix/Diagnosticar-Fire4Nix.sh"
          cp installer/Fire4Nix-Inspecionar-ELF.sh "$pkg/Fire4Nix/Fire4Nix-Inspecionar-ELF.sh"
          chmod +x "$pkg/Fire4Nix/bin/fire4nix-native-aarch64" \
            "$pkg/Fire4Nix/Fire4Nix-Iniciar.sh" \
            "$pkg/Fire4Nix-Primeiro-Teste-R36.sh" \
            "$pkg/Fire4Nix-EGL-R36H.py" \
            "$pkg/Fire4Nix-Direto.sh" "$pkg/Fire4Nix-Teste.sh" \
            "$pkg/Habilitar-Teste-Ports.sh" "$pkg/Diagnosticar-Fire4Nix.sh" \
            "$pkg/Fire4Nix/Fire4Nix-Teste.sh" \
            "$pkg/Fire4Nix/Diagnosticar-Fire4Nix.sh" \
            "$pkg/Fire4Nix/Fire4Nix-Inspecionar-ELF.sh"

      - name: Audit native binary against pinned WPE 2.54.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/package"
          bin="$pkg/Fire4Nix/bin/fire4nix-native-aarch64"
          lib="$pkg/Fire4Nix/runtime/lib/libWPEWebKit-2.0.so.1"
          readelf -h "$bin" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$bin" | grep -Eq 'Machine:[[:space:]]+AArch64'
          "$bin" --help | grep -q -- '--verify-home'
          readelf -h "$lib" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$lib" | grep -Eq "Data:.*2's complement, little endian"
          readelf -h "$lib" | grep -Eq 'Type:[[:space:]]+DYN'
          readelf -h "$lib" | grep -Eq 'Machine:[[:space:]]+AArch64'
          readelf -l "$lib" | grep -Eq 'LOAD[[:space:]]'
          readelf -l "$lib" | grep -Eq 'DYNAMIC[[:space:]]'
          readelf -d "$lib" | grep -Fq 'Library soname: [libWPEWebKit-2.0.so.1]'
          for process in WPEWebProcess WPENetworkProcess; do
            process_bin="$pkg/Fire4Nix/runtime/libexec/wpe-webkit-2.0/$process"
            readelf -h "$process_bin" | grep -Eq 'Class:[[:space:]]+ELF64'
            readelf -h "$process_bin" | grep -Eq 'Machine:[[:space:]]+AArch64'
          done
          readelf -d "$bin" | grep -Fq 'libgobject-2.0.so.0'
          readelf -d "$bin" | grep -Fq 'libglib-2.0.so.0'
          max_glibc="$(readelf --version-info "$bin" | grep -o 'Name: GLIBC_[0-9.]*' | sed 's/Name: GLIBC_//' | sort -V | tail -n 1)"
          echo "NATIVE_GLIBC_MAX=$max_glibc"
          test "$(printf '%s\n' "$max_glibc" 2.34 | sort -V | tail -n 1)" = 2.34
          readelf --dyn-syms -W "$lib" | awk '$7!="UND" {print $8}' | sed 's/@.*//' | sort -u > "$RUNNER_TEMP/wpe-exports.txt"
          cat > "$RUNNER_TEMP/wpe-required-symbols.txt" <<'EOF'
          jsc_value_to_string
          webkit_web_view_load_html
          webkit_get_major_version
          webkit_get_micro_version
          webkit_get_minor_version
          webkit_settings_get_type
          webkit_web_view_can_go_back
          webkit_web_view_can_go_forward
          webkit_web_view_evaluate_javascript
          webkit_web_view_evaluate_javascript_finish
          webkit_web_view_get_type
          webkit_web_view_get_uri
          webkit_web_view_get_wpe_view
          webkit_web_view_go_back
          webkit_web_view_go_forward
          webkit_web_view_load_uri
          webkit_web_view_reload
          webkit_web_view_set_settings
          wpe_event_get_event_type
          wpe_event_get_modifiers
          wpe_event_keyboard_get_keyval
          wpe_toplevel_fullscreen
          wpe_toplevel_get_state
          wpe_toplevel_set_title
          wpe_toplevel_unfullscreen
          wpe_view_get_display
          wpe_view_get_toplevel
          EOF
          while IFS= read -r symbol; do
            grep -Fxq "$symbol" "$RUNNER_TEMP/wpe-exports.txt" || {
              echo "MISSING_WPE_SYMBOL=$symbol" >&2
              exit 21
            }
          done < "$RUNNER_TEMP/wpe-required-symbols.txt"
          echo 'NATIVE_WPE_2_54_1_REQUIRED_SYMBOLS=26_OF_26'
          strings "$bin" | grep -Fq 'Fire4Nix native WPEPlatform 1.06'
          strings "$bin" | grep -Fq 'webkit_web_view_load_html'
          grep -Fxq 'GPU_PROCESS_PROFILE=disabled_verified_wayland' "$pkg/Fire4Nix/runtime/BUILD-REPORT.txt"
          grep -Fxq 'WPE_INSTALLED_ASSETS_PROFILE=strict' "$pkg/Fire4Nix/runtime/BUILD-REPORT.txt"
          grep -Fxq 'WPE_INSTALLED_ASSETS_STATUS=copied_and_static_elf_checked' "$pkg/Fire4Nix/runtime/BUILD-REPORT.txt"
          echo 'R36H_DEVICE_ABI_VERIFIED=no'
          echo 'R36H_FIRST_FRAME_VERIFIED=no'

      - name: Run packaging script, shell syntax and manifest checks
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/package"
          for script in \
            "$pkg/Fire4Nix/Fire4Nix-Iniciar.sh" \
            "$pkg/Fire4Nix-Primeiro-Teste-R36.sh" \
            "$pkg/Fire4Nix-Direto.sh" \
            "$pkg/Fire4Nix-Teste.sh" \
            "$pkg/Fire4Nix/Fire4Nix-Teste.sh" \
            "$pkg/Fire4Nix/Diagnosticar-Fire4Nix.sh"; do
            sh -n "$script"
          done
          python3 - "$pkg/Fire4Nix-EGL-R36H.py" <<'PYCODE'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text()
          compile(source, sys.argv[1], "exec")
          print("EGL_PROBE_PYTHON_SYNTAX=PASS")
          PYCODE
          sh native/tests/test_first_test_graphics_probe.sh
          sh native/tests/test_runtime_elf_guard.sh
          grep -Fq -- '--graphics-probe' "$pkg/Fire4Nix-Primeiro-Teste-R36.sh"
          test -s "$pkg/Fire4Nix-EGL-R36H.py"
          sh native/tests/test_local_html_mime_fallback.sh
          grep -Fq -- '--verify-offline' "$pkg/Fire4Nix/Fire4Nix-Iniciar.sh"
          grep -Fq -- '--verify-home' "$pkg/Fire4Nix/Fire4Nix-Iniciar.sh"
          grep -Fq 'home_ui_dom_keyboard_compact_form_shortcuts_focus=PASS' "$pkg/Fire4Nix-Primeiro-Teste-R36.sh"
          test -s "$pkg/Fire4Nix/www/inicio.html"
          grep -Fq 'ENGINE_FUNCTIONAL_TEST=PASS' "$pkg/Fire4Nix-Primeiro-Teste-R36.sh"
          grep -Fq 'WPE 2.54.1' "$pkg/LEIA-ME-PRIMEIRO-TESTE-R36H.txt"
          (cd "$pkg/Fire4Nix/runtime" && sha256sum -c SHA256SUMS.txt)
          cp "$RUNNER_TEMP/wpe-artifact/PROVENANCE.txt" "$pkg/PROVENANCE-WPE-RUNTIME.txt"
          native_sha="$(sha256sum "$pkg/Fire4Nix/bin/fire4nix-native-aarch64" | awk '{print $1}')"
          native_banner="$(strings "$pkg/Fire4Nix/bin/fire4nix-native-aarch64" | grep -F 'Fire4Nix native WPEPlatform ' | head -n 1)"
          test -n "$native_banner"
          native_version="${native_banner##* }"
          case "$native_version" in [0-9]*.[0-9]*) ;; *) echo "Invalid native launcher version: $native_version" >&2; exit 1 ;; esac
          native_glibc="$(readelf --version-info "$pkg/Fire4Nix/bin/fire4nix-native-aarch64" | grep -o 'Name: GLIBC_[0-9.]*' | sed 's/Name: GLIBC_//' | sort -V | tail -n 1)"
          test -n "$native_glibc"
          cat > "$pkg/PROVENANCE-NATIVE-LAUNCHER.txt" <<EOF
          NATIVE_LAUNCHER_WORKFLOW_RUN=${{ steps.native-run.outputs.run_id }}
          NATIVE_LAUNCHER_ARTIFACT_ID=${{ steps.native-run.outputs.artifact_id }}
          NATIVE_LAUNCHER_ARTIFACT_DIGEST=${{ steps.native-run.outputs.artifact_digest }}
          NATIVE_SOURCE_COMMIT=${{ steps.native-run.outputs.source_sha }}
          NATIVE_LAUNCHER_VERSION=$native_version
          NATIVE_BINARY_SHA256=$native_sha
          NATIVE_GLIBC_MAX=$native_glibc
          NATIVE_LOCAL_HTML_API=webkit_web_view_load_html
          EOF
          echo "NATIVE_LAUNCHER_VERSION=$native_version" >> "$GITHUB_ENV"
          echo "NATIVE_GLIBC_MAX=$native_glibc" >> "$GITHUB_ENV"
          chmod 0644 "$pkg/PROVENANCE-NATIVE-LAUNCHER.txt"
          cat > "$pkg/STATUS-PRIMEIRO-TESTE.txt" <<EOF
          FIRE4NIX_PACKAGE=R36H_FIRST_PHYSICAL_TEST
          WPE_RUNTIME_VERSION=2.54.1
          WPE_SANDBOX_PROFILE=disabled_at_build_security_reduced
          WPE_SANDBOX_SOURCE_COMMIT=5623e79c8705e7b10882cccf280fb2cfdbedc1b7
          WPE_RUNTIME_ARTIFACT_RUN=40033262653
          NATIVE_LAUNCHER_VERSION=$native_version
          NATIVE_LAUNCHER_WORKFLOW_RUN=${{ steps.native-run.outputs.run_id }}
          NATIVE_LAUNCHER_ARTIFACT_ID=${{ steps.native-run.outputs.artifact_id }}
          NATIVE_LAUNCHER_ARTIFACT_DIGEST=${{ steps.native-run.outputs.artifact_digest }}
          NATIVE_SOURCE_COMMIT=${{ steps.native-run.outputs.source_sha }}
          NATIVE_GLIBC_MAX=$native_glibc
          WPE_REQUIRED_RUNTIME_SYMBOLS=26_OF_26_STATICALLY_PRESENT
          ROCKNIX_SDK_CLOSURE=STATIC_CANDIDATES_ONLY
          R36H_DEVICE_ABI_VERIFIED=no
          R36H_EGL_DIAGNOSTIC_INCLUDED=yes
          R36H_EGL_PROBE_EXECUTED_ON_DEVICE=no
          R36H_WAYLAND_EGL_VERIFIED=no
          R36H_FIRST_FRAME_VERIFIED=no
          R36H_INTERACTIVE_BROWSING_VERIFIED=no
          SYSTEM_FILES_MODIFIED=no
          FIRMWARE_MODIFIED=no
          EOF
          chmod 0644 "$pkg/STATUS-PRIMEIRO-TESTE.txt"
          rm -f "$pkg/PACOTE-SHA256SUMS.txt"
          (cd "$pkg" && find . -type f ! -path './PACOTE-SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > PACOTE-SHA256SUMS.txt)
          (cd "$pkg" && sha256sum -c PACOTE-SHA256SUMS.txt > "$RUNNER_TEMP/package-manifest-check.txt")
          tail -n 3 "$RUNNER_TEMP/package-manifest-check.txt"

      - name: Build and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          package_name=Fire4Nix-R36H-Beta-20261031
          mv "$RUNNER_TEMP/package" "$RUNNER_TEMP/$package_name"
          (cd "$RUNNER_TEMP" && zip -9 -qr "$GITHUB_WORKSPACE/delivery/Fire4Nix-R36H-Beta-20261031.zip" "$package_name")
          unzip -t delivery/Fire4Nix-R36H-Beta-20261031.zip | tail -1
          sha256sum delivery/Fire4Nix-R36H-Beta-20261031.zip > delivery/SHA256SUMS.txt
          cp "$RUNNER_TEMP/$package_name/STATUS-PRIMEIRO-TESTE.txt" delivery/
          du -h delivery/Fire4Nix-R36H-Beta-20261031.zip
          unzip -l delivery/Fire4Nix-R36H-Beta-20261031.zip | head -15
          cat delivery/STATUS-PRIMEIRO-TESTE.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'PACKAGE_ZIP=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish R36H first-test package
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-R36H-Beta-20261031
          path: delivery/
          if-no-files-found: error
          retention-days: 30
