name: Fire4Nix combine FOUR genuine ROCKNIX AArch64 WPE dependencies

on:
  push:
    branches: ['feat/r36h-four-deps-integration-20261021']
    paths:
      - 'scripts/verify-four-rocknix-deps.sh'
      - '.github/workflows/r36h-four-deps-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  combined-target-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Download pinned genuine ROCKNIX compiler checkpoint (host only)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Download effective libpng 1.6.40 and its target zlib stage
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39677499120
          github-token: ${{ github.token }}
          name: Fire4Nix-RK3326-LibPNG-1.6.40-EFFECTIVE-ROCKNIX-TARGET
          path: png-artifact
      - name: Download pinned SQLite 3.50.2 ROCKNIX AArch64 stage
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39539424500
          github-token: ${{ github.token }}
          name: Fire4Nix-RK3326-SQLite-REAL-TARGET-TEST-ONLY
          path: sqlite-artifact
      - name: Download pinned libtasn1 4.21.0 ROCKNIX AArch64 stage
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39538774186
          github-token: ${{ github.token }}
          name: Fire4Nix-libtasn1-4.21.0-ROCKNIX-RK3326-STAGE-ONLY
          path: libtasn1-artifact
      - name: Restore genuine compiler only in its original isolated build path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test -x "$sdk/bin/aarch64-rocknix-linux-gnu-gcc"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
      - name: Assemble target-only private DESTDIR and cross-link four libraries
        shell: bash
        env:
          FIRE4NIX_COMBINED_WORK: ${{ github.workspace }}/four-rocknix
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/verify-four-rocknix-deps.sh
          bash fire4nix/scripts/verify-four-rocknix-deps.sh --check
          grep -Fxq 'FOUR_DEPENDENCY_STAGE=PASS_REAL_ROCKNIX_AARCH64' four-rocknix/report/acceptance.txt
          grep -Fxq 'FOUR_DEPENDENCY_CONSUMER_LINK=PASS_ALL_FOUR_REAL_SONAMES' four-rocknix/report/acceptance.txt
          {
            echo '## Genuine ROCKNIX AArch64 target dependency integration'
            cat four-rocknix/report/acceptance.txt
            echo 'Combined PRIVATE DESTDIR and cross-linked native consumer. No WebKit build or R36H device execution.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save artifact and diagnostic evidence on any result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-FOUR-REAL-DEPS-PRIVATE-STAGE
          path: |
            four-rocknix/report/
            four-rocknix/stage/
            four-rocknix/build/combined-consumer-aarch64
          retention-days: 14
          if-no-files-found: warn
