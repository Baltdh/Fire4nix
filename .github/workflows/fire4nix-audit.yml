name: Fire4Nix audit

on:
  push:
    branches: [main, codex/fire4nix-preparation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Fire4Nix
    steps:
      - uses: actions/checkout@v4

      - name: Install host audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libcurl4-openssl-dev

      - name: Shell and project audit
        run: bash scripts/project_audit.sh

      - name: Python syntax
        run: |
          python3 -m py_compile firefox-framebuffer-wrapper.py install-es-system.py
          python3 -m py_compile tests/test_browser_defaults.py

      - name: SDL compatibility build
        run: make AUDIT_MODE=1 BUILD_MODE=SDL_ONLY

      - name: Focused regression tests
        run: |
          make test-bridge
          make test-ipc
      - name: WPE state feedback contract
        run: |
          grep -F 'publishBrowserState' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_BROWSER_STATE_FILE' src/wpe/wpe_platform_launcher.cpp
          grep -F 'load-finished' src/wpe/wpe_platform_launcher.cpp
          grep -F 'web-process-terminated' src/wpe/wpe_platform_launcher.cpp
      - name: WPE IPC consumer contract
        run: |
          grep -F 'pollBrowserCommands' src/wpe/wpe_platform_launcher.cpp
          grep -F 'applyBrowserCommand' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_BROWSER_COMMAND_FILE' src/wpe/wpe_platform_launcher.cpp
          make test-renderer
          make test-gui

      - name: WPEPlatform window contract
        run: |
          grep -F 'webkit_web_view_get_wpe_view' src/wpe/wpe_platform_launcher.cpp
          grep -F 'wpe_toplevel_resize' src/wpe/wpe_platform_launcher.cpp
          grep -F 'wpe_toplevel_fullscreen' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_WPE_FULLSCREEN' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_DISPLAY_WIDTH' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_DISPLAY_HEIGHT' src/wpe/wpe_platform_launcher.cpp
          grep -F 'FIRE4NIX_WPE_MEMORY_LIMIT_MB' src/wpe/wpe_platform_launcher.cpp
          grep -F 'webkit_memory_pressure_settings_set_memory_limit' src/wpe/wpe_platform_launcher.cpp
          grep -F 'webkit_network_session_new' src/wpe/wpe_platform_launcher.cpp
          grep -F '"network-session"' src/wpe/wpe_platform_launcher.cpp
          if grep -Fq 'webkit_website_data_manager_' src/wpe/wpe_platform_launcher.cpp; then
            echo "Legacy WebsiteDataManager API leaked back into the WPE 2.0 launcher" >&2
            exit 1
          fi
          grep -F 'WPE_PLATFORM' scripts/fire4nix_env.sh
          grep -F 'fire4nix_wpe_platform_name' scripts/fire4nix_env.sh
          bash -n scripts/rocknix_wpe_smoke_test.sh
          sh -n scripts/build_wpe_cross.sh
          sh -n scripts/stage_wpe_runtime.sh
          sh -n scripts/verify_wpe_runtime.sh
          sh -n scripts/package_one_file.sh
          sh -n Fire4Nix.sh
          bash -n Install-Fire4Nix.sh
          grep -F "ELF 64-bit" scripts/package_one_file.sh
          grep -F 'verify_wpe_runtime.sh' scripts/package_one_file.sh
          grep -F 'WPEWebProcess' scripts/verify_wpe_runtime.sh
          grep -F 'WEBKIT_EXEC_PATH' scripts/fire4nix_env.sh
          grep -F 'ROCKNIX_SYSROOT' scripts/build_wpe_cross.sh
          grep -F 'Fire4Nix.sh" "$BIN_LINK' Install-Fire4Nix.sh
          grep -F 'WEBKIT_EXEC_PATH' patches/wpewebkit/0001-fire4nix-relocatable-process-path.patch

      - name: WPE ARM64 guard self-test
        run: sh tests/test_wpe_arm64_guard.sh

      - name: Makefile WPE detection regression check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("Makefile").read_text()
          assert "$(PKG_CONFIG) --exists $$pkg" in text
          assert "Compiler: $$($(CXX) -dumpmachine" in text
          print("Makefile WPE escaping: PASS")
          PY

  wpe-254-api-build:
    runs-on: ubuntu-24.04
    container:
      image: debian:sid-slim
    defaults:
      run:
        working-directory: Fire4Nix
    steps:
      - name: Prepare Debian sid container
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config libwpewebkit-2.0-dev file

      - uses: actions/checkout@v4

      - name: Confirm current WPE 2.0 API
        run: |
          pkg-config --exists wpe-webkit-2.0
          pkg-config --exists wpe-platform-2.0
          pkg-config --atleast-version=2.54.0 wpe-webkit-2.0
          echo "WPE WebKit $(pkg-config --modversion wpe-webkit-2.0)"

      - name: Compile native launcher against WPE 2.54 API
        run: |
          c++ -std=c++17 -O0 -g0 -Wall -Wextra \
            $(pkg-config --cflags wpe-webkit-2.0 wpe-platform-2.0) \
            src/wpe/wpe_platform_launcher.cpp \
            -o /tmp/fire4nix-wpe-api-check \
            $(pkg-config --libs wpe-webkit-2.0 wpe-platform-2.0)
          file /tmp/fire4nix-wpe-api-check
          /tmp/fire4nix-wpe-api-check --version

