name: Fire4Nix target ROCKNIX libgcrypt 1.11.1 and libgpg-error 1.55

on:
  push:
    branches: ['feat/r36h-libgcrypt-gpgerror-real-target-20261021']
    paths:
      - 'scripts/build-rocknix-gcrypt-gpgerror-target.sh'
      - '.github/workflows/r36h-rocknix-gcrypt-gpgerror-target.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rocknix-real-crypto-libs:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install GNU Autotools host-only tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make autoconf automake libtool gettext pkg-config \
            m4 gperf python3 binutils bzip2
          bash -n fire4nix/scripts/build-rocknix-gcrypt-gpgerror-target.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore pinned authentic ROCKNIX 20260801 RK3326 AArch64 GCC and sysroot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
      - name: Compile genuine cryptographic dependencies and link ARM64 consumer
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-gcrypt-gpgerror-target.sh 2>&1 | tee crypto-build-console.txt
          grep -Fxq 'LIBGPGERROR_TARGET=PASS_REAL_AARCH64_SHARED' gcrypt-target/reports/acceptance.txt
          grep -Fxq 'LIBGCRYPT_TARGET=PASS_REAL_AARCH64_SHARED' gcrypt-target/reports/acceptance.txt
          grep -Fxq 'LIBGCRYPT_CONSUMER_LINK=PASS_ELF64_AARCH64' gcrypt-target/reports/acceptance.txt
          cat gcrypt-target/reports/acceptance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve crypto target-only SDK libraries, headers and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-LibGcrypt-1.11.1-GpgError-1.55-TARGET-ONLY
          path: |
            gcrypt-target/reports/
            gcrypt-target/stage/usr/lib/
            gcrypt-target/stage/usr/include/
            gcrypt-target/libfire4nix-crypto-consumer.so
            crypto-build-console.txt
          retention-days: 14
          if-no-files-found: warn
