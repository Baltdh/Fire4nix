name: Fire4Nix genuine ROCKNIX AArch64 libepoxy 1.5.10 EGL dependency

on:
  push:
    branches: ['feat/r36h-rocknix-libepoxy-egl-1510-20261021']
    paths:
      - 'scripts/build-rocknix-libepoxy-egl-1510.sh'
      - '.github/workflows/r36h-rocknix-libepoxy-egl-1510.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  epoxy-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install host Meson tools, no Ubuntu EGL target headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ ninja-build pkg-config python3 python3-pip python3-packaging \
            python3-setuptools python3-pyelftools
          python3 -m pip install --user 'meson==1.8.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -n fire4nix/scripts/build-rocknix-libepoxy-egl-1510.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39692039643
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libglvnd-1.7.0-EGL-GLES2-TARGET-STAGE
          path: glvnd-artifact
      - name: Verify authentic target EGL development artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'GLVND_EGL_GLES_HEADERS=PASS_REAL_TARGET_STAGE' \
            glvnd-artifact/glvnd-target/reports/result.txt
          test -s glvnd-artifact/glvnd-target/stage/usr/include/EGL/eglplatform.h
          test -s glvnd-artifact/glvnd-target/stage/usr/include/KHR/khrplatform.h
      - name: Restore real ROCKNIX RK3326 AArch64 GCC + sysroot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
      - name: Compile actual target EGL libepoxy with source SHA and audit
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-libepoxy-egl-1510.sh 2>&1 | tee epoxy-console.txt
          grep -Fxq 'LIBEPOXY_EGL_BUILD=PASS_REAL_ROCKNIX_AARCH64' libepoxy-target/reports/result.txt
          grep -Fxq 'LIBEPOXY_CONSUMER_LINK=PASS_ELF64_AARCH64' libepoxy-target/reports/result.txt
          cat libepoxy-target/reports/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save actual SDK EGL census and target-only ELF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-libepoxy-1.5.10-EGL-TARGET-ONLY
          path: |
            libepoxy-target/reports/
            libepoxy-target/stage/usr/lib/
            libepoxy-target/stage/usr/include/
            libepoxy-target/libepoxy-consumer-aarch64.so
            epoxy-console.txt
          retention-days: 14
          if-no-files-found: warn
