name: Fire4Nix ROCKNIX Wayland 1.23.1 target and native scanner

on:
  push:
    branches: ['feat/r36h-wayland-1231-real-wpe-display-20261021']
    paths:
      - '.github/workflows/r36h-wayland-1231-real-target.yml'
      - 'scripts/build-rocknix-wayland-1231-wpe.sh'
      - 'scripts/assemble-rocknix-fontconfig-stages.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-scanner-plus-arm64-wayland:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install host generators and analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ python3 python3-pip python3-setuptools python3-packaging \
            libexpat1-dev ninja-build pkg-config cmake python3-pyelftools
          python3 -m pip install --user 'meson==1.8.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -n fire4nix/scripts/build-rocknix-wayland-1231-wpe.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39687860420
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Fontconfig-2.17.1-CAIRO-PREREQ-TEST-ONLY
          path: fontconfig-artifact
      - name: Restore vetted ROCKNIX RK3326 GCC into pinned path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar -tJf "$archive" > "$RUNNER_TEMP/wayland-sdk-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/wayland-sdk-members.txt"; then
            echo 'ERROR: unsafe SDK member' >&2; exit 4
          fi
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          echo 'ROCKNIX_SDK=PASS_REAL_AARCH64_GLIBC_2_41' >> "$GITHUB_STEP_SUMMARY"
      - name: Build native host scanner and four real Wayland AArch64 libraries
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-wayland-1231-wpe.sh 2>&1 | tee wayland-console.txt
          grep -Fxq 'WAYLAND_TARGET_BUILD=PASS_REAL_ROCKNIX_AARCH64' wayland-target/reports/acceptance.txt
          grep -Fxq 'WAYLAND_LINK_CONSUMER=PASS_FOUR_REAL_AARCH64_SONAMES' wayland-target/reports/acceptance.txt
          grep -Fxq 'WAYLAND_HOST_SCANNER=PASS_SEPARATE_NATIVE_GENERATOR' wayland-target/reports/acceptance.txt
      - name: Retain target ELF evidence and source checks, not an installable app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-Wayland-1.23.1-NATIVE-SCANNER-AARCH64-TARGET-ONLY
          path: |
            wayland-target/reports/
            wayland-target/stage/usr/lib/
            wayland-target/stage/usr/include/
            wayland-console.txt
          retention-days: 14
          if-no-files-found: warn
