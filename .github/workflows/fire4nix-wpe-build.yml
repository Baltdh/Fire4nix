name: Fire4Nix static checks and WPE build
on:
  push:
    branches: [feature/extracted-source-audit]
  pull_request:
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate launcher syntax and wrapper safety
        run: bash deploy/validate_launchers.sh
      - name: ShellCheck launcher entrypoints
        run: |
          shellcheck -s sh navegador-definitivo/Fire4Nix.sh deploy/Fire4Nix-ROCKNIX.sh deploy/Fire4Nix-WPE-Diagnostico.sh
      - name: Verify source-only placeholders are not ELF engines
        run: |
          file navegador-definitivo/bin/browser.arm64 navegador-definitivo/bin/fire4nix-wpe-platform
          if file navegador-definitivo/bin/fire4nix-wpe-platform | grep -q ELF; then
            echo "Unexpected ELF in wrapper path"; exit 1
          fi
  wpe-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
    steps:
      - name: Install ARM64 WPE build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config file binutils libglib2.0-dev libsoup-3.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev libegl-dev libgles-dev libwayland-dev libxkbcommon-dev libicu-dev libharfbuzz-dev libxml2-dev libxslt1-dev libsqlite3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libjpeg-dev libpng-dev libwebp-dev libavif-dev libjxl-dev liblcms2-dev libinput-dev libenchant-2-dev libatk1.0-dev libatk-bridge2.0-dev libharfbuzz-dev libfontconfig1-dev libfreetype-dev libgcrypt20-dev libsecret-1-dev libgbm-dev libdrm-dev libepoxy-dev libwoff-dev libopenjp2-7-dev libpsl-dev libhyphen-dev libseccomp-dev libsystemd-dev libudev-dev
      - uses: actions/checkout@v4
      - name: Retrieve previously compiled WPE ARM64 library
        uses: actions/download-artifact@v4
        with:
          name: Fire4Nix-WPE-ARM64-library-experimental
          run-id: 36968610673
          github-token: ${{ github.token }}
          path: library-artifact
      - name: Verify and install isolated WPE library
        run: |
          test "$(uname -m)" = aarch64
          cd library-artifact
          sha256sum -c SHA256SUMS
          tar -xzf Fire4Nix-WPE-ARM64-library.tar.gz -C /
          ldconfig
          pkg-config --exists wpe-webkit-2.0
      - name: Compile actual WPE launcher for ARM64
        working-directory: navegador-definitivo
        run: |
          make wpe-platform-launcher
          test -f fire4nix-wpe-platform
          file fire4nix-wpe-platform
          readelf -h fire4nix-wpe-platform | grep -E 'Class:|Machine:'
          readelf -d fire4nix-wpe-platform | grep NEEDED
          ldd fire4nix-wpe-platform
      - uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-WPE-ARM64-launcher-experimental
          path: navegador-definitivo/fire4nix-wpe-platform
          if-no-files-found: error
