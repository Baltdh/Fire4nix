name: Fire4Nix ROCKNIX JPEG 3.0.1 and eight real AArch64 dependencies

on:
  push:
    branches: ['feat/r36h-eight-deps-effective-jpeg-20261021']
    paths:
      - 'scripts/verify-rocknix-eight-deps-jpeg.sh'
      - '.github/workflows/r36h-rocknix-eight-deps-jpeg.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jpeg-eight-libs:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libjpeg-turbo/libjpeg-turbo
          ref: ec32420f6b5dfa4e86883d42b209e8371e55aeb5
          path: jpeg-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39682062894
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-SEVEN-REAL-DEPS-PRIVATE-STAGE
          path: seven-artifact
      - name: Restore pinned genuine cross-compiler only in runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          test "$(git -C jpeg-source rev-parse HEAD)" = ec32420f6b5dfa4e86883d42b209e8371e55aeb5
          test -s "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf \
            "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          test -s seven-artifact/seven-deps/stage/usr/lib/pkgconfig/gio-2.0.pc
      - name: Configure CMake with original ROCKNIX target JPEG 3.0.1 options
        shell: bash
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          mkdir -p jpeg-reports
          grep -Fxq 'PKG_VERSION="3.0.1"' rocknix-source/projects/ROCKNIX/packages/graphics/libjpeg-turbo/package.mk
          grep -Fxq 'PKG_VERSION="3.1.1"' rocknix-source/packages/graphics/libjpeg-turbo/package.mk
          grep -Fxq 'set(VERSION 3.0.1)' jpeg-source/CMakeLists.txt
          cmake -S jpeg-source -B "$RUNNER_TEMP/jpeg-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$sdk/fire4nix-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=/usr/lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_STATIC=ON -DENABLE_SHARED=ON -DWITH_JPEG8=ON \
            -DWITH_SIMD=ON -DENABLE_TESTING=OFF \
            2>&1 | tee jpeg-reports/configure.log
          grep -Fxq 'WITH_SIMD:BOOL=ON' "$RUNNER_TEMP/jpeg-build/CMakeCache.txt"
          grep -Fxq 'WITH_JPEG8:BOOL=ON' "$RUNNER_TEMP/jpeg-build/CMakeCache.txt"
          grep -Fxq 'ENABLE_SHARED:BOOL=ON' "$RUNNER_TEMP/jpeg-build/CMakeCache.txt"
          grep -Fxq 'ENABLE_STATIC:BOOL=ON' "$RUNNER_TEMP/jpeg-build/CMakeCache.txt"
          grep -Fxq 'CMAKE_INSTALL_LIBDIR:PATH=/usr/lib' "$RUNNER_TEMP/jpeg-build/CMakeCache.txt"
      - name: Build both static and shared JPEG for ROCKNIX AArch64 (not host)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/jpeg-build" --parallel 2 \
            2>&1 | tee jpeg-reports/build.log
          DESTDIR="$GITHUB_WORKSPACE/jpeg-target-stage" \
            cmake --install "$RUNNER_TEMP/jpeg-build" \
            2>&1 | tee jpeg-reports/install.log
      - name: Merge JPEG 3.0.1 and seven ROCKNIX libraries and link ARM64
        shell: bash
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/verify-rocknix-eight-deps-jpeg.sh
          bash fire4nix/scripts/verify-rocknix-eight-deps-jpeg.sh
          grep -Fxq 'EIGHT_TARGET_STAGE=PASS_REAL_ROCKNIX_AARCH64' eight-deps/report/result.txt
          grep -Fxq 'EIGHT_TARGET_CONSUMER_LINK=PASS_JPEG_GIO_GLIB_PNG_ZLIB_SQLITE_LIBTASN1' eight-deps/report/result.txt
          {
            echo '## Effective ROCKNIX project JPEG 3.0.1 — real AArch64 build'
            cat eight-deps/report/result.txt
            echo 'Private cross-linked stage, not an installable browser.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain diagnostics, JPEG target and merged private stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-EIGHT-REAL-DEPS-JPEG-3.0.1-TARGET-ONLY
          path: |
            jpeg-reports/
            jpeg-target-stage/usr/lib/
            jpeg-target-stage/usr/include/
            eight-deps/report/
            eight-deps/stage/
            eight-deps/build/
          retention-days: 14
          if-no-files-found: warn
