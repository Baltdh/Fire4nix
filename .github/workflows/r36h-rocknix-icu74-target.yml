name: Fire4Nix build genuine ROCKNIX ICU 74.1 AArch64 for HarfBuzz and WPE
on:
  push:
    branches: ['feat/r36h-icu74-real-target-20261021']
    paths:
      - 'scripts/build-rocknix-icu74-target.sh'
      - '.github/workflows/r36h-rocknix-icu74-target.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  icu-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore pinned ROCKNIX SDK and host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config python3
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz" -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
      - name: Build native ICU generators and AArch64 ICU shared libraries
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/build-rocknix-icu74-target.sh
          bash fire4nix/scripts/build-rocknix-icu74-target.sh | tee icu-build-console.txt
          grep -Fxq 'ICU_TARGET=PASS_REAL_ROCKNIX_AARCH64' icu74-target/reports/acceptance.txt
      - name: Save target stage and diagnostics, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-ICU-74.1-REAL-TARGET-STAGE
          path: |
            icu74-target/stage/
            icu74-target/reports/
            icu-build-console.txt
          retention-days: 14
          if-no-files-found: warn
