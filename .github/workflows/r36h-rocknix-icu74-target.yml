name: Fire4Nix cross-compile genuine ROCKNIX ICU74 host and target
on:
  push:
    branches: ['feat/r36h-icu74-host-target-build-20261021']
    paths:
      - 'scripts/build-rocknix-icu74-target.sh'
      - '.github/workflows/r36h-rocknix-icu74-target.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  icu74-host-and-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore genuine ROCKNIX cross-compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz" -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
      - name: Compile host ICU generators and target AArch64 ICU 74.1
        shell: bash
        run: |
          set -euo pipefail
          bash -n fire4nix/scripts/build-rocknix-icu74-target.sh
          bash fire4nix/scripts/build-rocknix-icu74-target.sh | tee icu74-console.txt
          grep -Fxq 'ICU74_BUILD=PASS_REAL_ROCKNIX_AARCH64' icu74-target/reports/result.txt
      - name: Preserve ICU target libs, host-target diagnostic logs and ELF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-ICU74.1-REAL-TARGET-STAGE
          path: |
            icu74-target/stage/
            icu74-target/reports/
            icu74-console.txt
          retention-days: 14
          if-no-files-found: warn
