name: Fire4Nix genuine ROCKNIX AArch64 libglvnd 1.7.0 EGL SDK headers

on:
  push:
    branches: ['feat/r36h-rocknix-libglvnd-egl-170-20261021']
    paths:
      - '.github/workflows/r36h-rocknix-libglvnd-egl-170.yml'
      - 'scripts/build-rocknix-libglvnd-egl-170.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  glvnd-egl-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install host Meson builders
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ ninja-build pkg-config python3 python3-pip python3-packaging \
            python3-setuptools python3-pyelftools
          python3 -m pip install --user 'meson==1.8.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -n fire4nix/scripts/build-rocknix-libglvnd-egl-170.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore exact ROCKNIX AArch64 compiler into disposable source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
      - name: Build target EGL/GLES2 dispatch and audit real SDK headers
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-libglvnd-egl-170.sh 2>&1 | tee glvnd-console.txt
          grep -Fxq 'GLVND_EGL_GLES_HEADERS=PASS_REAL_TARGET_STAGE' glvnd-target/reports/result.txt
          grep -Fxq 'GLVND_EGL_GLES_SHARED=PASS_REAL_ROCKNIX_AARCH64' glvnd-target/reports/result.txt
          cat glvnd-target/reports/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve target-only EGL dispatch, headers and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-libglvnd-1.7.0-EGL-GLES2-TARGET-STAGE
          path: |
            glvnd-target/reports/
            glvnd-target/stage/usr/lib/
            glvnd-target/stage/usr/include/
            glvnd-console.txt
          retention-days: 14
          if-no-files-found: warn
