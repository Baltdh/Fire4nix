name: Fire4Nix WPE 2.54.1 reduced Wayland configure without DRM or GBM

on:
  push:
    branches: ['test/r36h-wpe2541-minimal-wayland-no-drm-20261021']
    paths:
      - '.github/workflows/r36h-wpe2541-post-harfbuzz-configure.yml'
      - 'scripts/probe-wpe-post-harfbuzz-target-configure.sh'
      - 'scripts/assemble-wpe-post-harfbuzz-stage.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wpe-cmake-after-harfbuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39683307528
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-EIGHT-REAL-DEPS-JPEG-3.0.1-TARGET-ONLY
          path: eight-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39687860420
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Fontconfig-2.17.1-CAIRO-PREREQ-TEST-ONLY
          path: fontconfig-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39688962028
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Cairo-1.17.8-TARGET-PREREQ-ONLY
          path: cairo-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39688837904
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-ICU-74.1-REAL-TARGET-STAGE
          path: icu-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39692709765
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-HarfBuzz-11.2.1-ICU-ON-TARGET
          path: harfbuzz-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39692039643
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libglvnd-1.7.0-EGL-GLES2-TARGET-STAGE
          path: glvnd-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39692741218
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libepoxy-1.5.10-EGL-TARGET-ONLY
          path: epoxy-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39694338119
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-LibGcrypt-1.11.1-GpgError-1.55-TARGET-ONLY
          path: gcrypt-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39695603819
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libsoup3-3.6.5-TARGET-ONLY-NO-TLS-SMOKE
          path: soup3-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39695182915
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-nghttp2-1.66.0-libpsl-0.21.5-TARGET
          path: soup-prereqs-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39697406436
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-XkbCommon-1.6.0-Wayland-WPE-TEST-ONLY
          path: xkb-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39683707451
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-EIGHT-DEPS-WEBP-TEST-ONLY
          path: webp-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39683799673
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-libxslt-1.1.43-TARGET-STAGE
          path: libxslt-artifact
      - name: Restore genuine pinned ROCKNIX AArch64 compiler, not Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          grep -Fxq 'HARFBUZZ_ICU=PASS_REAL_ROCKNIX_AARCH64' \
            harfbuzz-artifact/harfbuzz-icu-target/reports/result.txt
          grep -Fxq 'LIBEPOXY_EGL_BUILD=PASS_REAL_ROCKNIX_AARCH64' \
            epoxy-artifact/libepoxy-target/reports/result.txt
          grep -Fxq 'ICU_TARGET=PASS_REAL_ROCKNIX_AARCH64' \
            icu-artifact/icu74-target/reports/acceptance.txt
          grep -Fxq 'GLVND_EGL_GLES_HEADERS=PASS_REAL_TARGET_STAGE' \
            glvnd-artifact/glvnd-target/reports/result.txt
          grep -Fxq 'LIBGCRYPT_TARGET=PASS_REAL_AARCH64_SHARED' \
            gcrypt-artifact/gcrypt-target/reports/acceptance.txt
          grep -Fxq 'LIBGPGERROR_TARGET=PASS_REAL_AARCH64_SHARED' \
            gcrypt-artifact/gcrypt-target/reports/acceptance.txt
          grep -Fxq 'LIBSOUP3_TARGET=PASS_REAL_ROCKNIX_AARCH64' \
            soup3-artifact/soup3-target/reports/acceptance.txt
          grep -Fxq 'SOUP3_TLS_RUNTIME=NOT_VERIFIED_REQUIRES_GIO_GNUTLS' \
            soup3-artifact/soup3-target/reports/acceptance.txt
          grep -Fxq 'NGHTTP2_TARGET=PASS_REAL_ROCKNIX_AARCH64' \
            soup-prereqs-artifact/soup-prereqs-target/reports/acceptance.txt
          grep -Fxq 'LIBPSL_TARGET=PASS_REAL_ROCKNIX_AARCH64' \
            soup-prereqs-artifact/soup-prereqs-target/reports/acceptance.txt
          grep -Fxq 'XKBCOMMON_BUILD=PASS_REAL_ROCKNIX_AARCH64' \
            xkb-artifact/xkbcommon-target/reports/acceptance.txt
          grep -Fxq 'XKB_WAYLAND_CONSUMER=PASS_REAL_AARCH64_FOUR_SONAMES' \
            xkb-artifact/xkbcommon-target/reports/acceptance.txt
          test -s xkb-artifact/xkbcommon-target/stage/usr/lib/pkgconfig/xkbcommon.pc
          grep -Fxq 'EIGHT_DEPENDENCY_STAGE=PASS_REAL_ROCKNIX_AARCH64' \
            webp-artifact/webp-reports/acceptance.txt
          grep -Fxq 'WEBP_GLIB_PNG_CONSUMER_LINK=PASS_REAL_AARCH64' \
            webp-artifact/webp-reports/acceptance.txt
          test -s webp-artifact/eight-rocknix-stage/usr/include/webp/decode.h
          grep -Fxq 'LIBXSLT_BUILD=PASS_REAL_ROCKNIX_AARCH64' \
            libxslt-artifact/libxslt-target/reports/result.txt
          test -s libxslt-artifact/libxslt-target/stage/usr/lib/pkgconfig/libxslt.pc
      - name: Install CMake diagnostic host programs (not target libraries)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config python3 perl ruby gperf bison flex unifdef
          command -v unifdef
          test -x /usr/bin/unifdef
          python3 -m py_compile fire4nix/scripts/assemble-wpe-post-harfbuzz-stage.py
          bash -n fire4nix/scripts/probe-wpe-post-harfbuzz-target-configure.sh
      - name: Verify actual HarfBuzz gate disappeared on real WPE 2.54.1 CMake
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/probe-wpe-post-harfbuzz-target-configure.sh
          report=wpe-post-harfbuzz-probe/report/status.txt
          grep -Fxq 'ROCKNIX_REAL_SDK_AARCH64=PASS' "$report"
          grep -Fxq 'HARFBUZZ_ICU_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'LIBGCRYPT_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'SOUP3_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'XKBCOMMON_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'WEBP_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'LIBXSLT_FIRST_BLOCKER_CLEARED=YES' "$report"
          grep -Fxq 'WPE_REDUCED_WAYLAND_NO_DRM_GBM=PASS_CMAKE_CACHE_GATED' "$report"
          grep -Fxq 'WPE_WEBKIT_BUILT=no' "$report"
          grep -Fxq 'TARGET_EXECUTED=no' "$report"
          {
            echo '## Genuine ROCKNIX WPE CMake with minimal Wayland and DRM/GBM explicitly off'
            cat "$report"
            echo ''
            echo 'Successful diagnostic does NOT mean a complete WPE compile.'
            echo ''
            echo '### Next CMake errors (if any)'
            grep -E -A 8 'CMake Error|Could NOT find|Could not find|required package' \
              wpe-post-harfbuzz-probe/report/cmake.log | head -n 120 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep full CMake diagnostics and verified stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-WPE2541-ROCKNIX-REDUCED-WAYLAND-NO-DRM-CMAKE-DIAGNOSTIC
          path: |
            wpe-post-harfbuzz-probe/report/
            wpe-post-harfbuzz-probe/configure/CMakeCache.txt
            wpe-post-harfbuzz-probe/configure/CMakeFiles/CMakeConfigureLog.yaml
            wpe-post-harfbuzz-probe/configure/CMakeFiles/CMakeError.log
          retention-days: 14
          if-no-files-found: warn
