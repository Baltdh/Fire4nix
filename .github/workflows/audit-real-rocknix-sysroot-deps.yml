name: Fire4Nix REAL ROCKNIX RK3326 sysroot WPE dependencies census
on:
  push:
    branches: ['test/rocknix-real-sysroot-wpe-deps-20261021']
    paths:
      - '.github/workflows/audit-real-rocknix-sysroot-deps.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  real-sdk-metadata-readiness:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - name: Checkout Fire4Nix code
        uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - name: Download PINNED real RK3326 toolchain from successful Actions 39525819979
        uses: actions/download-artifact@v4
        with:
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          repository: Baltdh/Fire4nix
          run-id: 39525819979
          github-token: ${{ github.token }}
          path: host-checkpoint
      - name: Inspect real installed sysroot (NO target execution or package build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64 reports
          test -s host-checkpoint/rocknix-toolchain-host-only.tar.xz
          tar -xJf host-checkpoint/rocknix-toolchain-host-only.tar.xz -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$PWD/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          sysroot="$sdk/aarch64-rocknix-linux-gnu/sysroot"
          export FIRE4NIX_ROCKNIX_SYSROOT="$sysroot" FIRE4NIX_ROCKNIX_TOOLCHAIN="$sdk/fire4nix-toolchain.cmake"
          export FIRE4NIX_ROCKNIX_RELEASE=20260801
          sh fire4nix/rocknix-integration/check-rocknix-sdk.sh --check > reports/sdk-identity.txt
          sh fire4nix/rocknix-integration/audit-wpe-sysroot-pkgconfig.sh --inspect > reports/target-pkgconfig.txt
          set +e
          sh fire4nix/rocknix-integration/audit-wpe-target-elf-providers.sh --inspect > reports/target-elf-and-tls.txt 2>&1
          rc=$?
          set -e
          echo "ELF_AUDIT_EXIT=$rc" > reports/status.txt
          if grep -Fxq 'SYSROOT_PC_AUDIT=PASS_TARGET_PKGCONFIG_METADATA_ONLY' reports/target-pkgconfig.txt &&
             grep -Fxq 'TARGET_ELF_AUDIT=PASS_STATIC_AARCH64_PROVIDERS_TLS_MODULE' reports/target-elf-and-tls.txt; then
            echo 'WPE_TARGET_DEPS_METADATA_READY=yes' >> reports/status.txt
          else
            echo 'WPE_TARGET_DEPS_METADATA_READY=no' >> reports/status.txt
            echo 'NEXT_ACTION=STAGE_MISSING_TARGET_DEVELOPMENT_LIBRARIES_AND_TLS_BACKEND' >> reports/status.txt
          fi
          {
            echo '### Real ROCKNIX 20260801 sysroot census'
            echo 'This reads the actual gcc/glibc sysroot from verified host-only toolchain 39525819979, not fake fixture pkg-config files.'
            echo 'Actual WPE WebKit is not compiled, linked or launched.'
            echo ''
            echo '#### Results'
            cat reports/status.txt
            echo ''
            cat reports/target-pkgconfig.txt
            echo ''
            cat reports/target-elf-and-tls.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve true sysroot census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-REAL-ROCKNIX-sysroot-WPE-dependency-census
          path: reports/
          retention-days: 21
          if-no-files-found: error
