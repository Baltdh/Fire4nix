name: WPE WebKit real headless ARM64 integration

on:
  push:
    branches:
      - codex/wpe-headless-arm64-integration-20261030
    paths:
      - 'native/fire4nix_wpeplatform.cpp'
      - 'native/tests/test_headless_integration_contract.py'
      - 'installer/www/primeiro-teste.html'
      - '.github/workflows/wpe-headless-arm64-integration.yml'
  pull_request:
    paths:
      - 'native/fire4nix_wpeplatform.cpp'
      - 'native/tests/test_headless_integration_contract.py'
      - 'installer/www/primeiro-teste.html'
      - '.github/workflows/wpe-headless-arm64-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:unstable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian ARM64 WPE 2.54.2 and build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential pkg-config python3 file openssl \
            libglib2.0-dev libglib2.0-bin shared-mime-info glib-networking \
            libwpewebkit-2.0-dev
          version="$(dpkg-query -W -f='${Version}' libwpewebkit-2.0-1)"
          echo "WPE_PACKAGE_VERSION=$version"
          case "$version" in
            2.54.2*) ;;
            *) echo "Expected Debian WPE 2.54.2, got $version" >&2; exit 20 ;;
          esac
          pkg-config --modversion wpe-webkit-2.0
          pkg-config --exists wpe-platform-2.0
          mime_type="$(gio info --attributes=standard::content-type \
            "$GITHUB_WORKSPACE/installer/www/primeiro-teste.html" | \
            sed -n 's/^[[:space:]]*standard::content-type: //p' | head -n 1)"
          echo "WPE_FILE_FIXTURE_MIME=$mime_type"
          test "$mime_type" = "text/html"
          dpkg-query -W -f='${Status}' glib-networking | grep -Fq 'install ok installed'
          test -s /usr/lib/aarch64-linux-gnu/gio/modules/libgiognutls.so
          echo 'WPE_HEADLESS_TLS_BACKEND=GLIB_NETWORKING_INSTALLED'
          echo 'WPE_HEADLESS_MIME_DATABASE=SHARED_MIME_INFO_PRESENT'
          echo 'WPE_HEADLESS_TEST_ENGINE=REAL_DEBIAN_ARM64_PACKAGE_2.54.2'

      - name: Run host-side contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tests/test_headless_integration_contract.py
          python3 -m py_compile native/tests/test_headless_integration_contract.py

      - name: Compile Fire4Nix native launcher for ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/headless logs
          g++ -std=c++17 -O2 -g -Wall -Wextra -Werror \
            native/fire4nix_wpeplatform.cpp \
            $(pkg-config --cflags --libs glib-2.0 gobject-2.0 gio-2.0) \
            -ldl -o build/headless/fire4nix-native-headless
          file build/headless/fire4nix-native-headless
          readelf -h build/headless/fire4nix-native-headless | grep -q AArch64
          build/headless/fire4nix-native-headless --selftest

      - name: Run real WPE 2.54.2 against local file and data-URI fixtures
        shell: bash
        run: |
          set -euo pipefail
          web_process="$(find /usr -type f -name WPEWebProcess -print -quit)"
          test -n "$web_process" && test -x "$web_process"
          webkit_exec_path="$(dirname "$web_process")"
          test -x "$webkit_exec_path/WPENetworkProcess"
          mkdir -p "$RUNNER_TEMP/fire4nix-home" "$RUNNER_TEMP/fire4nix-cache"
          test -s installer/www/primeiro-teste.html
          echo 'WPE_HEADLESS_FIXTURE_FILE=present'
          sha256sum installer/www/primeiro-teste.html
          page="file://$GITHUB_WORKSPACE/installer/www/primeiro-teste.html"

          set +e
          env -u WPE_DISPLAY \
            WPE_PLATFORM=headless \
            WEBKIT_EXEC_PATH="$webkit_exec_path" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            FIRE4NIX_LOW_MEMORY=1 \
            HOME="$RUNNER_TEMP/fire4nix-home" \
            XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
            timeout --signal=TERM --kill-after=10s 100s \
            build/headless/fire4nix-native-headless --verify-offline "$page" \
            > logs/wpe-headless-file-url.log 2>&1
          file_rc=$?
          set -e
          cat logs/wpe-headless-file-url.log
          if [ "$file_rc" -eq 0 ] && grep -Fq '[FIRE4NIX-VERIFY] button_event=PASS' logs/wpe-headless-file-url.log; then
            echo 'WPE_FILE_URI=PASS_REAL_HTML_JS_CSS_CLICK' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "WPE_FILE_URI=FAIL_EXIT_$file_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '\[FIRE4NIX-VERIFY\] detail=|title=|inline_javascript=|computed_css=|button_event=' \
              logs/wpe-headless-file-url.log || true
            exit 31
          fi

          # The same trusted HTML over data: separates DOM/JS execution from
          # file-URL policy and sandbox filesystem access. This is a control
          # experiment, not a substitute for the file:// test.
          data_page="data:text/html;base64,$(base64 -w0 installer/www/primeiro-teste.html)"
          set +e
          env -u WPE_DISPLAY \
            WPE_PLATFORM=headless \
            WEBKIT_EXEC_PATH="$webkit_exec_path" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            FIRE4NIX_LOW_MEMORY=1 \
            HOME="$RUNNER_TEMP/fire4nix-home" \
            XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
            timeout --signal=TERM --kill-after=10s 100s \
            build/headless/fire4nix-native-headless --verify-offline "$data_page" \
            > logs/wpe-headless-data-url.log 2>&1
          data_rc=$?
          set -e
          cat logs/wpe-headless-data-url.log
          if [ "$data_rc" -ne 0 ]; then
            echo "WPE_DATA_URI=FAIL_EXIT_$data_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$data_rc"
          fi
          grep -Fq '[FIRE4NIX-VERIFY] offline_dom=PASS' logs/wpe-headless-data-url.log
          grep -Fq '[FIRE4NIX-VERIFY] inline_javascript=PASS' logs/wpe-headless-data-url.log
          grep -Fq '[FIRE4NIX-VERIFY] computed_css=PASS' logs/wpe-headless-data-url.log
          grep -Fq '[FIRE4NIX-VERIFY] button_event=PASS' logs/wpe-headless-data-url.log
          echo 'WPE_DATA_URI=PASS_REAL_ENGINE_DOM_JS_CSS_CLICK' | tee -a "$GITHUB_STEP_SUMMARY"

          # Controlled localhost servers isolate WebKit networking and TLS from
          # public DNS, remote availability and third-party certificate changes.
          mkdir -p "$RUNNER_TEMP/fire4nix-web-root"
          cp installer/www/primeiro-teste.html "$RUNNER_TEMP/fire4nix-web-root/index.html"
          COOKIE_FIXTURE_OUT="$RUNNER_TEMP/fire4nix-web-root/cookie-check.html" python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path("installer/www/primeiro-teste.html").read_text()
          old = 'status.textContent="JS OK";'
          new = "status.textContent=(document.cookie.indexOf('fire4nix_test=accepted')!==-1)?'JS OK':'JS FALHOU';"
          assert source.count(old) == 1, "offline fixture JS status assignment changed"
          Path(os.environ["COOKIE_FIXTURE_OUT"]).write_text(source.replace(old, new))
          PY
          cat > "$RUNNER_TEMP/fire4nix-web-root/nav-start.html" <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>Fire4Nix Nav Start</title></head>
          <body><p id="nav-state">START_JS_PENDING</p><a id="nav-next" href="/nav-target.html">Next</a>
          <script>document.getElementById('nav-state').textContent='START_JS_OK';</script></body></html>
          EOF
          cat > "$RUNNER_TEMP/fire4nix-web-root/nav-target.html" <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>Fire4Nix Nav Target</title></head>
          <body><p id="nav-state">TARGET_JS_PENDING</p><a id="nav-back" href="/nav-start.html">Back</a>
          <script>document.getElementById('nav-state').textContent='TARGET_JS_OK';</script></body></html>
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/fire4nix-test-ca.key" \
            -out "$RUNNER_TEMP/fire4nix-test-ca.crt" \
            -subj "/CN=Fire4Nix Local Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/fire4nix-localhost.key" \
            -out "$RUNNER_TEMP/fire4nix-localhost.csr" \
            -subj "/CN=localhost"
          cat > "$RUNNER_TEMP/fire4nix-server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          EOF
          openssl x509 -req -in "$RUNNER_TEMP/fire4nix-localhost.csr" \
            -CA "$RUNNER_TEMP/fire4nix-test-ca.crt" \
            -CAkey "$RUNNER_TEMP/fire4nix-test-ca.key" -CAcreateserial \
            -out "$RUNNER_TEMP/fire4nix-localhost.crt" -days 2 -sha256 \
            -extfile "$RUNNER_TEMP/fire4nix-server.ext"
          install -m 0644 "$RUNNER_TEMP/fire4nix-test-ca.crt" \
            /usr/local/share/ca-certificates/fire4nix-local-test-ca.crt
          update-ca-certificates
          # A second, deliberately untrusted certificate is used only for the
          # negative TLS test. It is never installed into the trust store.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/fire4nix-untrusted.key" \
            -out "$RUNNER_TEMP/fire4nix-untrusted.crt" \
            -subj "/CN=localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign,cRLSign" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          cat > "$RUNNER_TEMP/fire4nix-local-servers.py" <<'PY'
          import functools
          import http.server
          import os
          import ssl
          import sys
          import threading

          root, cert, key, bad_cert, bad_key = sys.argv[1:6]
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=root, **kwargs)
              def guess_type(self, path):
                  if path.lower().endswith(".html"):
                      return "text/html"
                  return super().guess_type(path)
              def do_GET(self):
                  if self.path == "/set-cookie":
                      self.send_response(302)
                      self.send_header("Location", "/cookie-check.html")
                      self.send_header("Set-Cookie", "fire4nix_test=accepted; Path=/; SameSite=Lax")
                      self.end_headers()
                      return
                  return super().do_GET()
              def log_message(self, fmt, *args):
                  print("LOCAL_SERVER " + (fmt % args), flush=True)

          def serve(port, tls=False, untrusted=False):
              server = http.server.ThreadingHTTPServer(("127.0.0.1", port), Handler)
              if tls:
                  context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
                  context.load_cert_chain(bad_cert if untrusted else cert,
                                          bad_key if untrusted else key)
                  server.socket = context.wrap_socket(server.socket, server_side=True)
              print(f"LOCAL_SERVER_READY port={port} tls={tls} untrusted={untrusted}", flush=True)
              server.serve_forever()

          threads = [
              threading.Thread(target=serve, args=(18765, False), daemon=True),
              threading.Thread(target=serve, args=(18766, True), daemon=True),
              threading.Thread(target=serve, args=(18767, True, True), daemon=True),
          ]
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          PY
          python3 "$RUNNER_TEMP/fire4nix-local-servers.py" \
            "$RUNNER_TEMP/fire4nix-web-root" \
            "$RUNNER_TEMP/fire4nix-localhost.crt" \
            "$RUNNER_TEMP/fire4nix-localhost.key" \
            "$RUNNER_TEMP/fire4nix-untrusted.crt" \
            "$RUNNER_TEMP/fire4nix-untrusted.key" > logs/local-servers.log 2>&1 &
          server_pid=$!
          cleanup_servers() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup_servers EXIT
          python3 - <<'PY'
          import socket, time
          for port in (18765, 18766, 18767):
              for attempt in range(80):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      if attempt == 79:
                          raise
                      time.sleep(0.25)
          print("WPE_LOCAL_SERVERS=READY_HTTP_AND_HTTPS")
          PY

          run_network_fixture() {
            label="$1"
            url="$2"
            rc=0
            env -u WPE_DISPLAY \
              WPE_PLATFORM=headless \
              WEBKIT_EXEC_PATH="$webkit_exec_path" \
              WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              FIRE4NIX_LOW_MEMORY=1 \
              HOME="$RUNNER_TEMP/fire4nix-home" \
              XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
              timeout --signal=TERM --kill-after=10s 100s \
              build/headless/fire4nix-native-headless --verify-offline "$url" \
              > "logs/wpe-headless-$label.log" 2>&1 || rc=$?
            cat "logs/wpe-headless-$label.log"
            if [ "$rc" -ne 0 ]; then
              echo "WPE_$label=FAIL_EXIT_$rc" | tee -a "$GITHUB_STEP_SUMMARY"
              return "$rc"
            fi
            for marker in offline_dom inline_javascript computed_css button_event; do
              grep -Fq "[FIRE4NIX-VERIFY] $marker=PASS" "logs/wpe-headless-$label.log" || {
                echo "WPE_$label=FAIL_MISSING_$marker" | tee -a "$GITHUB_STEP_SUMMARY"
                return 32
              }
            done
            echo "WPE_$label=PASS_REAL_WPE_NETWORK_DOM_JS_CSS_CLICK" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          run_network_fixture HTTP "http://127.0.0.1:18765/index.html"
          run_network_fixture HTTPS "https://localhost:18766/index.html"

          cookie_rc=0
          env -u WPE_DISPLAY \
            WPE_PLATFORM=headless \
            WEBKIT_EXEC_PATH="$webkit_exec_path" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            FIRE4NIX_LOW_MEMORY=1 \
            HOME="$RUNNER_TEMP/fire4nix-home" \
            XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
            timeout --signal=TERM --kill-after=10s 100s \
            build/headless/fire4nix-native-headless --verify-offline \
            "http://127.0.0.1:18765/set-cookie" \
            > logs/wpe-headless-cookie-redirect.log 2>&1 || cookie_rc=$?
          cat logs/wpe-headless-cookie-redirect.log
          if [ "$cookie_rc" -ne 0 ]; then
            echo "WPE_REDIRECT_COOKIE=FAIL_EXIT_$cookie_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$cookie_rc"
          fi
          grep -Fq 'location=http://127.0.0.1:18765/cookie-check.html' \
            logs/wpe-headless-cookie-redirect.log
          grep -Fq '[FIRE4NIX-VERIFY] inline_javascript=PASS' \
            logs/wpe-headless-cookie-redirect.log
          echo 'WPE_REDIRECT_COOKIE=PASS_302_SET_COOKIE_SESSION' | tee -a "$GITHUB_STEP_SUMMARY"

          invalid_tls_rc=0
          env -u WPE_DISPLAY \
            WPE_PLATFORM=headless \
            WEBKIT_EXEC_PATH="$webkit_exec_path" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            FIRE4NIX_LOW_MEMORY=1 \
            HOME="$RUNNER_TEMP/fire4nix-home" \
            XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
            timeout --signal=TERM --kill-after=10s 100s \
            build/headless/fire4nix-native-headless --smoke \
            "https://localhost:18767/index.html" \
            > logs/wpe-headless-invalid-tls.log 2>&1 || invalid_tls_rc=$?
          cat logs/wpe-headless-invalid-tls.log
          if [ "$invalid_tls_rc" -eq 0 ] || \
             ! grep -Fq 'load-failed url=https://localhost:18767/index.html' logs/wpe-headless-invalid-tls.log || \
             ! grep -Eiq 'certificate|TLS|SSL' logs/wpe-headless-invalid-tls.log; then
            echo "WPE_HTTPS_INVALID_CERT=UNEXPECTED_RESULT_EXIT_$invalid_tls_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 33
          fi
          echo 'WPE_HTTPS_INVALID_CERT=REJECTED_AS_REQUIRED' | tee -a "$GITHUB_STEP_SUMMARY"

          navigation_rc=0
          env -u WPE_DISPLAY \
            WPE_PLATFORM=headless \
            WEBKIT_EXEC_PATH="$webkit_exec_path" \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            FIRE4NIX_LOW_MEMORY=1 \
            FIRE4NIX_NAV_TARGET_URL="http://127.0.0.1:18765/nav-target.html" \
            HOME="$RUNNER_TEMP/fire4nix-home" \
            XDG_CACHE_HOME="$RUNNER_TEMP/fire4nix-cache" \
            timeout --signal=TERM --kill-after=10s 100s \
            build/headless/fire4nix-native-headless --verify-navigation \
            "http://127.0.0.1:18765/nav-start.html" \
            > logs/wpe-headless-navigation.log 2>&1 || navigation_rc=$?
          cat logs/wpe-headless-navigation.log
          if [ "$navigation_rc" -ne 0 ]; then
            echo "WPE_NAVIGATION=FAIL_EXIT_$navigation_rc" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$navigation_rc"
          fi
          grep -Fq '[FIRE4NIX-NAV] navigation=PASS' logs/wpe-headless-navigation.log
          grep -Fq '[FIRE4NIX-NAV] history_back=PASS' logs/wpe-headless-navigation.log
          grep -Fq '[FIRE4NIX-NAV] history_forward=PASS' logs/wpe-headless-navigation.log
          grep -Fq '[FIRE4NIX-NAV] page_reload=PASS' logs/wpe-headless-navigation.log
          grep -Fq '[FIRE4NIX-NAV] reload_cycles=2' logs/wpe-headless-navigation.log
          echo 'WPE_NAVIGATION=PASS_TWO_PAGES_BACK_FORWARD_TWO_RELOADS' | tee -a "$GITHUB_STEP_SUMMARY"
          cat logs/local-servers.log
          echo 'WPE_HARDWARE_FRAME_VERIFIED=no' | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'WPE_ROCKNIX_ABI_VERIFIED=no' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preserve headless logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-WPE-Headless-ARM64-Logs
          path: |
            logs/
            build/headless/
          if-no-files-found: warn
          retention-days: 14
