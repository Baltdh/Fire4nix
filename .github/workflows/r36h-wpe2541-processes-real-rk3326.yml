name: Fire4Nix WPE WebProcess and NetworkProcess ROCKNIX real ARM64

on:
  # User-requested genuine cross-build, isolated from main and manual test flows.
  # Pushing this branch triggers one WPEWebKit + subprocess build, not mocks.
  push:
    branches: ['build/r36h-webkit2541-fix-fourcc-all-processes-20261022']
    paths:
      - 'scripts/patch-wpe2541-drm-fourcc.py'
      - 'scripts/prepare-unified-rocknix-wpe2541.sh'
      - 'native/tests/test_wpe2541_fourcc_patch.py'
      - '.github/workflows/r36h-wpe2541-processes-real-rk3326.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-fourcc-source-patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the upstream WPE snapshot constant fix without downloading a toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-wpe2541-drm-fourcc.py native/tests/test_wpe2541_fourcc_patch.py
          python3 native/tests/test_wpe2541_fourcc_patch.py
          bash -n scripts/prepare-unified-rocknix-wpe2541.sh
          bash -n scripts/build-wpe2541-subprocesses-rocknix.sh
          echo 'WPE_2541_FOURCC_SOURCE_PATCH=PASS_HOST_ONLY' >> "$GITHUB_STEP_SUMMARY"
  real-wpe-processes:
    needs: verify-fourcc-source-patch
    runs-on: ubuntu-22.04
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Host tools and offline syntax validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config python3 perl ruby gperf bison flex \
            unifdef wayland-protocols libwayland-bin binutils file
          bash -n fire4nix/scripts/prepare-unified-rocknix-wpe2541.sh
          bash -n fire4nix/scripts/build-wpe2541-subprocesses-rocknix.sh
          sh -n fire4nix/scripts/verify-unified-wpe-media-cache.sh
          test -x /usr/bin/unifdef
          test -x /usr/bin/wayland-scanner
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39712898635
          github-token: ${{ github.token }}
          name: Fire4Nix-STEP1-Unified-RK3326-AARCH64-SDK-NOT-INSTALLABLE
          path: stage1-artifact
      - name: Restore immutable ROCKNIX 20260801 AArch64 compiler and stage-1 metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar -tJf "$archive" > "$RUNNER_TEMP/step2-sdk-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/step2-sdk-members.txt"; then
            echo 'ERROR: unsafe SDK member path' >&2; exit 4
          fi
          tar --no-same-owner --no-same-permissions -xJf "$archive" \
            -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          grep -Fxq 'TARGET_PC_MISSING_COUNT=0' stage1-artifact/stage1-reports/pkgconfig-readiness.txt
          grep -Fxq 'STAGE1_ROCKNIX_COMBINED=PASS_REAL_ELF64_AARCH64_COLLISION_SAFE' stage1-artifact/stage1-reports/merge.txt
      - name: Configure authentic WPE 2.54.1 reduced Wayland engine
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/prepare-unified-rocknix-wpe2541.sh
          grep -Fxq 'WPE_CMAKE_EXIT_CODE=0' wpe-unified-sdk-build/report/status.txt
          grep -Fxq 'WPE_TARGET_CONFIGURE=CONFIGURED_REQUIRES_ABI_REVIEW' wpe-unified-sdk-build/report/status.txt
          grep -Fxq 'WPE_REDUCED_WAYLAND_NO_DRM_GBM=PASS_CMAKE_CACHE_GATED' wpe-unified-sdk-build/report/status.txt
          grep -Fxq 'WPE_WAYLAND_PROTOCOLS=ROCKNIX_1_44_DATA_ONLY' wpe-unified-sdk-build/report/status.txt
          grep -Fxq 'WPE_SOURCE_PATCH=WPE2541_WPE_SNAPSHOT_FOURCC_NO_LIBDRM_V1' wpe-unified-sdk-build/report/status.txt
          grep -Fxq 'WPE_SOURCE_PATCH_DRM_GBM_ENABLED=no' wpe-unified-sdk-build/report/wpe2541-fourcc-patch.txt
          echo 'WPE_CONFIGURED_FOR_TWO_WPE_PROCESSES=PASS_REAL_ROCKNIX_AARCH64' >> "$GITHUB_STEP_SUMMARY"
      - name: Build native ROCKNIX WPEWebProcess and WPENetworkProcess and stage offline runtime
        shell: bash
        timeout-minutes: 230
        run: |
          set -euo pipefail
          # This script defaults to a safe usage error; opt in explicitly to cross-compilation.
          bash fire4nix/scripts/build-wpe2541-subprocesses-rocknix.sh --build
          grep -Fxq 'WPE_SUBPROCESS_BUILD=PASS_REAL_AARCH64' \
            wpe-unified-sdk-build/report/wpe-subprocesses-result.txt
      - name: Audit a genuinely linked WebKit library and both processes, if they exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=wpe-unified-sdk-build/compiled-target-evidence
          mkdir -p "$out" wpe-unified-sdk-build/report
          report="$out/README-NOT-INSTALLABLE.txt"
          printf 'Fire4Nix WPE 2.54.1 - uninstalled compiled ELF audit only\nTARGET_EXECUTED=no\nR36H_INSTALLABLE=no\n' > "$report"
          build=wpe-unified-sdk-build/configure
          if [ ! -d "$build" ]; then
            echo 'COMPILED_WPE_ELF=NO_BUILD_DIRECTORY' >> "$report"
            exit 0
          fi
          mapfile -d '' -t candidates < <(find "$build" -type f -name 'libWPEWebKit-2.0.so*' -print0)
          if [ "${#candidates[@]}" -eq 1 ]; then
            cp "${candidates[0]}" "$out/libWPEWebKit-2.0.so.1"
            if python3 fire4nix/scripts/verify-built-wpewebkit.py \
                --library "$out/libWPEWebKit-2.0.so.1" \
                --report "$out/webkit-elf-audit.txt"; then
              echo 'COMPILED_WPE_ELF=PASS_STATIC_ELF64_AARCH64' >> "$report"
            else
              echo 'COMPILED_WPE_ELF=REJECTED_STATIC_ELF_AUDIT' >> "$report"
              rm -f "$out/libWPEWebKit-2.0.so.1"
            fi
          else
            echo "COMPILED_WPE_ELF=NOT_UNIQUE_OR_UNLINKED count=${#candidates[@]}" >> "$report"
          fi
          for name in WPEWebProcess WPENetworkProcess; do
            mapfile -d '' -t candidates < <(find "$build" -type f -name "$name" -print0)
            if [ "${#candidates[@]}" -eq 1 ] \
              && readelf -h "${candidates[0]}" | grep -Eq 'Class:.*ELF64' \
              && readelf -h "${candidates[0]}" | grep -Eq 'Machine:.*AArch64'; then
              cp "${candidates[0]}" "$out/$name"
              echo "COMPILED_${name}=PASS_STATIC_ELF64_AARCH64" >> "$report"
            else
              echo "COMPILED_${name}=MISSING_OR_INVALID_ELF" >> "$report"
            fi
          done
          (cd "$out" && find . -maxdepth 1 -type f -print0 | xargs -0 -r sha256sum) > "$out/SHA256SUMS.txt"
          cat "$report"
      - name: Preserve CMake, compiler logs and uninstalled compiled ELF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-WPE2541-TWO-PROCESSES-STATIC-STAGE-NOT-INSTALLABLE
          path: |
            wpe-unified-sdk-build/report/
            wpe-unified-sdk-build/configure/CMakeCache.txt
            wpe-unified-sdk-build/private-wpe-runtime/
            wpe-unified-sdk-build/compiled-target-evidence/
          retention-days: 14
          if-no-files-found: warn
