name: Fire4Nix WPE ARM64 library
on:
  push:
    branches: [codex/fire4nix-preparation]
    paths: ['.github/workflows/fire4nix-wpe-library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patched-library:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    container:
      image: debian:sid-slim
    steps:
      - name: Prepare source build
        run: |
          printf '%s\n' 'deb-src http://deb.debian.org/debian sid main' > /etc/apt/sources.list.d/fire4nix-source.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git devscripts dpkg-dev python3 file
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config ruby gperf unifdef libglib2.0-dev libsoup-3.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev libicu-dev libharfbuzz-dev libjpeg-dev libpng-dev libwebp-dev libavif-dev libjxl-dev libopenjp2-7-dev liblcms2-dev libfontconfig1-dev libfreetype-dev libgcrypt20-dev libtasn1-6-dev libsqlite3-dev libxml2-dev libxslt1-dev libhyphen-dev libenchant-2-dev libepoxy-dev libgbm-dev libegl-dev libgles-dev libwayland-dev wayland-protocols libinput-dev libsystemd-dev libxkbcommon-dev zlib1g-dev libatk1.0-dev libatk-bridge2.0-dev libwoff-dev libseccomp-dev libpsl-dev libbrotli-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdrm-dev libudev-dev libsecret-1-dev bubblewrap xdg-dbus-proxy
      - uses: actions/checkout@v4
      - name: Fetch and patch release library source
        run: |
          mkdir -p library-build
          cd library-build
          apt-get source wpewebkit
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path('.').glob('wpewebkit-*/Source/WebKit/Shared/glib/ProcessExecutablePathGLib.cpp'))
          if len(roots) != 1:
              raise SystemExit('Expected exactly one WPE source tree')
          path = roots[0]
          text = path.read_text()
          old = 'static String findWebKitProcess(const ASCIILiteral processName)\n{\n#if ENABLE(DEVELOPER_MODE)\n'
          new = 'static String findWebKitProcess(const ASCIILiteral processName)\n{\n'
          if text.count(old) != 1:
              raise SystemExit('Upstream process resolver changed; refusing an unverified patch')
          text = text.replace(old, new, 1)
          old = '    static String executablePath = getExecutablePath();'
          if text.count(old) != 1:
              raise SystemExit('Developer-mode resolver anchor changed')
          text = text.replace(old, '#if ENABLE(DEVELOPER_MODE)\n' + old, 1)
          text = text.replace('if (execDirectory) {', "if (execDirectory && g_path_is_absolute(execDirectory)) {", 1)
          path.write_text(text)
          Path('patched-process-resolver.cpp').write_text(text)
          PY
      - name: Compile patched WPE library and subprocesses
        run: |
          cd library-build
          source_dir=$(find . -maxdepth 1 -type d -name 'wpewebkit-*' | head -n 1)
          test -n "$source_dir"
          cd "$source_dir"
          test "$(dpkg --print-architecture)" = arm64
          cmake -S . -B build-fire4nix -G Ninja -DPORT=WPE -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_WEB_RTC=OFF -DENABLE_SPEECH_SYNTHESIS=OFF -DENABLE_INTROSPECTION=OFF -DENABLE_DOCUMENTATION=OFF -DENABLE_MINIBROWSER=OFF -DUSE_LIBBACKTRACE=OFF > ../library-configure.log 2>&1 || { tail -n 120 ../library-configure.log; exit 1; }
          cmake --build build-fire4nix --parallel 2 > ../library-build.log 2>&1 || { tail -n 120 ../library-build.log; exit 1; }
          DESTDIR="$PWD/../stage" cmake --install build-fire4nix
          tar -C ../stage -czf ../Fire4Nix-WPE-ARM64-library.tar.gz usr
      - name: Record experimental library provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > library-build/COMMIT.txt
          printf '%s\n' 'Experimental ARM64 WPE library rebuilt from Debian sid source.' 'Patched release process resolver accepts absolute WEBKIT_EXEC_PATH.' 'Not validated against the ROCKNIX sysroot or device ABI.' 'Initial build disables video, WebAudio, WebRTC and speech synthesis.' 'Library prefix is experimental; do not copy over ROCKNIX system libraries.' > library-build/README.txt
          cd library-build
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Save library artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-WPE-ARM64-library-experimental
          path: |
            library-build/*.tar.gz
            library-build/*.buildinfo
            library-build/*.changes
            library-build/*.log
            library-build/patched-process-resolver.cpp
            library-build/README.txt
            library-build/COMMIT.txt
            library-build/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
