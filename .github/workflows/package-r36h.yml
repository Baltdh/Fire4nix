name: Package Fire4Nix R36H Integrated
on:
  push:
    paths:
      - 'source_r36h/**'
      - 'scripts/Fire4Nix-R36H-Resgate.sh'
      - '.github/workflows/package-r36h.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source and original browser assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/original stage/pkg/Tools/Fire4Nix dist
          unzip -q -o Fire4Nix_consolidated_latest_real_backup_wpe_integration_cleaned_with_launcher.zip -d stage/original
          cp -a stage/original/Fire4Nix/. stage/pkg/Tools/Fire4Nix/
          rm -rf stage/pkg/Tools/Fire4Nix/third_party_reference stage/pkg/Tools/Fire4Nix/rocknix_reference
          cp -a source_r36h/Fire4Nix/. stage/pkg/Tools/Fire4Nix/
          cp scripts/Fire4Nix-R36H-Resgate.sh stage/pkg/Tools/Fire4Nix/Fire4Nix-R36H-Resgate.sh
          bash -n stage/pkg/Tools/Fire4Nix/scripts/run_browser.sh
          bash -n stage/pkg/Tools/Fire4Nix/scripts/fire4nix_env.sh
          sh -n stage/pkg/Tools/Fire4Nix/Fire4Nix.sh
          sh -n stage/pkg/Tools/Fire4Nix/Fire4Nix-R36H-Resgate.sh
          test -f stage/pkg/Tools/Fire4Nix/src/wpe/wpe_platform_launcher.cpp
          test -f stage/pkg/Tools/Fire4Nix/www/inicio.html
          cat > stage/pkg/Atualizar-Fire4Nix-R36H.sh <<'SHELL'
          #!/bin/sh
          set -eu
          BASE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)
          SOURCE="$BASE/Tools/Fire4Nix"
          [ -f "$SOURCE/scripts/run_browser.sh" ] || { echo 'ERRO: Pacote incompleto'; exit 2; }
          DEST="${FIRE4NIX_DEST:-}"
          if [ -z "$DEST" ]; then
            for candidate in /storage/games-internal/roms/tools/Fire4Nix /storage/games-external/roms/tools/Fire4Nix; do
              if [ -d "$candidate" ]; then DEST=$candidate; break; fi
            done
          fi
          if [ -z "$DEST" ] || [ ! -d "$DEST" ] || [ ! -w "$DEST" ]; then
            echo 'Instalação existente não encontrada: defina FIRE4NIX_DEST.'
            exit 2
          fi
          BACKUP="$DEST/backup-prev-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP"
          for entry in scripts Fire4Nix.sh fire4nix.conf; do
            if [ -e "$DEST/$entry" ]; then cp -a "$DEST/$entry" "$BACKUP/"; fi
          done
          if [ -f "$DEST/bin/fire4nix-wpe-platform" ]; then
            mkdir -p "$BACKUP/bin"
            cp -a "$DEST/bin/fire4nix-wpe-platform" "$BACKUP/bin/"
          fi
          cp -a "$SOURCE/." "$DEST/"
          if [ -f "$BACKUP/bin/fire4nix-wpe-platform" ]; then
            cp -a "$BACKUP/bin/fire4nix-wpe-platform" "$DEST/bin/fire4nix-wpe-platform"
          fi
          if [ -f "$BACKUP/fire4nix.conf" ]; then cp -a "$BACKUP/fire4nix.conf" "$DEST/fire4nix.conf"; fi
          chmod +x "$DEST/Fire4Nix.sh" "$DEST/Fire4Nix-R36H-Resgate.sh" "$DEST/scripts/"*.sh "$DEST/bin/"* 2>/dev/null || true
          echo "Fire4Nix atualizado; backup em $BACKUP"
          if [ ! -s "$DEST/runtime/lib/libWPEWebKit-2.0.so.1" ]; then
            echo 'AVISO: biblioteca ARM64 WPE ausente. Atualização não é um WebKit completo.'
          fi
          SHELL
          sh -n stage/pkg/Atualizar-Fire4Nix-R36H.sh
          cat > stage/pkg/LEIA-ME-PRIMEIRO.txt <<'README'
          Fire4Nix 0.84 R36H - atualizacao para instalacao existente
          Extraia e execute Atualizar-Fire4Nix-R36H.sh com Terminal R36.
          O instalador preserva o runtime e executavel WebKit existentes.
          Use Fire4Nix-R36H-Resgate.sh para salvar logs de erro.
          A GPU Mali, Wayland e sandbox exigem teste real no R36H.
          README
          (cd stage/pkg && zip -qr ../../dist/Fire4Nix-R36H-0.84-integrated-github.zip .)
          unzip -t dist/Fire4Nix-R36H-0.84-integrated-github.zip | tail -2
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Test safe installer preserving user data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-fire4nix/bin /tmp/test-fire4nix/runtime/lib
          printf '#!/bin/sh\nexit 139\n' > /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          chmod +x /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          printf 'existing-wpe' > /tmp/test-fire4nix/runtime/lib/libWPEWebKit-2.0.so.1
          printf 'custom-settings' > /tmp/test-fire4nix/fire4nix.conf
          FIRE4NIX_DEST=/tmp/test-fire4nix sh stage/pkg/Atualizar-Fire4Nix-R36H.sh
          grep -q 'exit 139' /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          grep -q 'existing-wpe' /tmp/test-fire4nix/runtime/lib/libWPEWebKit-2.0.so.1
          grep -q 'custom-settings' /tmp/test-fire4nix/fire4nix.conf
          test -n "$(find /tmp/test-fire4nix -maxdepth 1 -name 'backup-prev-*' -print -quit)"
          echo 'PASS: original executable, library, configuration and rollback backup'
      - uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-R36H-0.84-integrated-test
          path: dist/
          retention-days: 30
