name: Package Fire4Nix R36H Integrated
on:
  push:
    paths:
      - 'source_r36h/**'
      - 'scripts/Fire4Nix-R36H-Resgate.sh'
      - '.github/workflows/package-r36h.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source and original browser assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/original stage/pkg/Tools/Fire4Nix dist
          unzip -q -o Fire4Nix_consolidated_latest_real_backup_wpe_integration_cleaned_with_launcher.zip -d stage/original
          cp -a stage/original/Fire4Nix/. stage/pkg/Tools/Fire4Nix/
          rm -rf stage/pkg/Tools/Fire4Nix/third_party_reference stage/pkg/Tools/Fire4Nix/rocknix_reference
          cp -a source_r36h/Fire4Nix/. stage/pkg/Tools/Fire4Nix/
          cp scripts/Fire4Nix-R36H-Resgate.sh stage/pkg/Tools/Fire4Nix/Fire4Nix-R36H-Resgate.sh
          bash -n stage/pkg/Tools/Fire4Nix/scripts/run_browser.sh
          bash -n stage/pkg/Tools/Fire4Nix/scripts/fire4nix_env.sh
          sh -n stage/pkg/Tools/Fire4Nix/Fire4Nix.sh
          sh -n stage/pkg/Tools/Fire4Nix/Fire4Nix-R36H-Resgate.sh
          sh -n stage/pkg/Tools/Fire4Nix/Fire4Nix-Diagnosticar.sh
          test -f stage/pkg/Tools/Fire4Nix/src/wpe/wpe_platform_launcher.cpp
          test -f stage/pkg/Tools/Fire4Nix/www/inicio.html
          # Neither overwrite nor distribute the user's original WPE binary, runtime or config.
          rm -f stage/pkg/Tools/Fire4Nix/bin/fire4nix-wpe-platform
          rm -f stage/pkg/Tools/Fire4Nix/fire4nix.conf
          rm -rf stage/pkg/Tools/Fire4Nix/.mozilla_profile
          cp source_r36h/Atualizar-Fire4Nix-R36H.sh stage/pkg/
          cp source_r36h/1-Verificar-Fire4Nix-R36H.sh stage/pkg/
          cp source_r36h/2-Abrir-Fire4Nix-R36H.sh stage/pkg/
          chmod +x stage/pkg/*.sh stage/pkg/Tools/Fire4Nix/Fire4Nix-Diagnosticar.sh
          sh -n stage/pkg/Atualizar-Fire4Nix-R36H.sh
          cp source_r36h/LEIA-ME-PRIMEIRO.txt stage/pkg/
          (cd stage/pkg && zip -qr ../../dist/Fire4Nix-R36H-0.85-integrated-github.zip .)
          unzip -t dist/Fire4Nix-R36H-0.85-integrated-github.zip | tail -2
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Test safe installer preserving user data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-fire4nix/bin /tmp/test-fire4nix/runtime/lib
          printf '#!/bin/sh\necho mock-wpe\nexit "${MOCK_STATUS:-139}"\n' > /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          chmod +x /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          printf 'existing-wpe' > /tmp/test-fire4nix/runtime/lib/libWPEWebKit-2.0.so.1
          printf 'custom-settings' > /tmp/test-fire4nix/fire4nix.conf
          FIRE4NIX_DEST=/tmp/test-fire4nix sh stage/pkg/Atualizar-Fire4Nix-R36H.sh
          grep -q 'exit 139' /tmp/test-fire4nix/bin/fire4nix-wpe-platform
          grep -q 'existing-wpe' /tmp/test-fire4nix/runtime/lib/libWPEWebKit-2.0.so.1
          grep -q 'custom-settings' /tmp/test-fire4nix/fire4nix.conf
          test -n "$(find /tmp/test-fire4nix -maxdepth 1 -name 'backup-prev-*' -print -quit)"
          test ! -f stage/pkg/Tools/Fire4Nix/bin/fire4nix-wpe-platform
          test ! -d stage/pkg/Tools/Fire4Nix/runtime
          test ! -f stage/pkg/Tools/Fire4Nix/fire4nix.conf
          mkdir -p /tmp/test-fire4nix/runtime/libexec/wpe-webkit-2.0
          for child in WPEWebProcess WPENetworkProcess WPEGPUProcess; do
            printf '#!/bin/sh\\nexit 0\\n' > "/tmp/test-fire4nix/runtime/libexec/wpe-webkit-2.0/$child"
            chmod +x "/tmp/test-fire4nix/runtime/libexec/wpe-webkit-2.0/$child"
          done
          FIRE4NIX_LOG_DIR=/tmp/fire4nix-ci-log sh /tmp/test-fire4nix/Fire4Nix-Diagnosticar.sh --check --root /tmp/test-fire4nix | grep CHECK_OK
          set +e
          MOCK_STATUS=139 FIRE4NIX_LOG_DIR=/tmp/fire4nix-ci-log sh /tmp/test-fire4nix/Fire4Nix-Diagnosticar.sh --headless --root /tmp/test-fire4nix
          exit_code=$?
          set -e
          test "$exit_code" -eq 139
          echo 'PASS: original executable, library, configuration and rollback backup'
      - uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-R36H-0.85-integrated-test
          path: dist/
          retention-days: 30
