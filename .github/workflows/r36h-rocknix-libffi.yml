name: Fire4Nix real ROCKNIX AArch64 libffi target library
on:
  push:
    branches: ['feat/r36h-rocknix-libffi-target-20261021']
    paths:
      - '.github/workflows/r36h-rocknix-libffi.yml'
      - 'scripts/build-rocknix-libffi.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  libffi-real-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - name: Restore original ROCKNIX GCC host path and verify target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libffi-reports "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64"
          archive="$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz"
          test -s "$archive"
          tar --no-same-owner --no-same-permissions -xJf "$archive" -C "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64"
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test -x "$sdk/bin/aarch64-rocknix-linux-gnu-gcc"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = 'aarch64-rocknix-linux-gnu'
          test -f "$sdk/fire4nix-toolchain.cmake"
          readelf -h "$sdk/aarch64-rocknix-linux-gnu/sysroot/usr/lib/libc.so.6" | grep -Eq 'Machine:.*AArch64'
          grep -Fq "$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64" "$sdk/fire4nix-toolchain.cmake"
          echo 'ROCKNIX_TOOLCHAIN_RESTORED=PASS' | tee libffi-reports/compiler-report.txt
      - name: Build patched ROCKNIX static PIC libffi and link ARM64 shared consumer
        shell: bash
        run: bash fire4nix/scripts/build-rocknix-libffi.sh
      - name: Preserve libffi target stage and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-libffi-3.5.1-STATIC-PIC-STAGE
          path: |
            libffi-build/stage/
            libffi-build/reports/
            libffi-build/libfire4nix-ffi-probe.so
          retention-days: 14
          if-no-files-found: warn
