name: Fire4Nix target HarfBuzz 11.2.1 with REAL ROCKNIX ICU
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  harfbuzz-icu-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: fire4nix
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ROCKNIX/distribution
          ref: 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          path: rocknix-source
          persist-credentials: false
      - name: Install host-only Meson tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ ninja-build pkg-config python3-pip python3-packaging gettext
          python3 -m pip install --user 'meson==1.8.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -n fire4nix/scripts/build-rocknix-harfbuzz-icu-target.sh
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39525819979
          github-token: ${{ github.token }}
          name: ROCKNIX-RK3326-toolchain-HOST-ONLY
          path: ${{ runner.temp }}/sdk-download
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39687860420
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Fontconfig-2.17.1-CAIRO-PREREQ-TEST-ONLY
          path: fontconfig-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39688962028
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-Cairo-1.17.8-TARGET-PREREQ-ONLY
          path: cairo-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39689390988
          github-token: ${{ github.token }}
          name: Fire4Nix-ROCKNIX-ICU74.1-REAL-TARGET-STAGE
          path: icu-artifact
      - name: Restore pinned ROCKNIX toolchain in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rocknix-source rev-parse HEAD)" = 3b9cb1f6bf48ee9ca0cf01edd9af52ca2a6b73fb
          mkdir -p rocknix-source/build.ROCKNIX-RK3326.aarch64
          tar --no-same-owner --no-same-permissions -xJf "$RUNNER_TEMP/sdk-download/rocknix-toolchain-host-only.tar.xz" -C rocknix-source/build.ROCKNIX-RK3326.aarch64
          sdk="$GITHUB_WORKSPACE/rocknix-source/build.ROCKNIX-RK3326.aarch64/toolchain"
          test "$("$sdk/bin/aarch64-rocknix-linux-gnu-gcc" -dumpmachine)" = aarch64-rocknix-linux-gnu
          grep -Fxq 'ICU74_BUILD=PASS_REAL_ROCKNIX_AARCH64' icu-artifact/icu74-target/reports/result.txt
          grep -Fxq 'CAIRO_TARGET_BUILD=PASS_REAL_ROCKNIX_AARCH64' cairo-artifact/cairo-target/reports/acceptance.txt
      - name: Compile genuine HarfBuzz 11.2.1 with ICU ON, link target probe
        shell: bash
        run: |
          set -euo pipefail
          bash fire4nix/scripts/build-rocknix-harfbuzz-icu-target.sh 2>&1 | tee harfbuzz-icu-console.txt
          grep -Fxq 'HARFBUZZ_ICU=PASS_REAL_ROCKNIX_AARCH64' harfbuzz-icu-target/reports/result.txt
          grep -Fxq 'ICU_COMPONENT=ENABLED' harfbuzz-icu-target/reports/result.txt
      - name: Preserve target stage and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fire4Nix-ROCKNIX-HarfBuzz-11.2.1-ICU-ON-TARGET
          path: |
            harfbuzz-icu-target/stage/
            harfbuzz-icu-target/reports/
            harfbuzz-icu-console.txt
          retention-days: 14
          if-no-files-found: warn
